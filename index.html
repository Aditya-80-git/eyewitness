<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="EYEWITNESS — Witness the Story of Everything. An interactive scientific journey from the Big Bang to the Solar System.">
  <title>EYEWITNESS — Witness the Story of Everything</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap">
  <style>
/* ==========================================================================
   EYEWITNESS — Stage 1 stylesheet
   Tokens first, then layers: stage → welcome → intro → event panel →
   timeline → controls. Phases/visibility are driven by classes on #app
   (set from script.js), so later stages can add layers without touching this.
   ========================================================================== */

:root {
  --black: #000;
  --ink: #eaf0fb;
  --ink-dim: rgba(234, 240, 251, 0.62);
  --ink-faint: rgba(234, 240, 251, 0.38);
  --gold: #ffd9a3;
  --glow-cool: 150, 180, 255;
  --glow-warm: 255, 214, 160;

  --font-display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
  --font-serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);

  --dot: 14px;
  --pad: clamp(16px, 4vw, 48px);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--black);
  color: var(--ink);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

#app {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overflow: clip;            /* clip, not just hidden: hidden is still scrollable by focus/selection */
  background: var(--black);
}

p, h1, h2 { margin: 0; }
[hidden] { display: none !important; }

button { font: inherit; color: inherit; }
:focus-visible {
  outline: 1px solid rgba(var(--glow-warm), 0.9);
  outline-offset: 4px;
}

/* ==========================================================================
   Stage: haze + canvas + core + flash + vignette
   ========================================================================== */

#stage {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 2.4s ease;
  will-change: transform;
  pointer-events: none;
}
#app.show-stage #stage { opacity: 1; }

#canvas-host, #canvas-host canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* Three atmospheric layers, cross-faded by opacity (cheap to animate). */
.haze {
  position: absolute;
  inset: -10%;
  opacity: 0;
  transition: opacity 5s ease;
}
.haze[data-haze="0"] {
  background:
    radial-gradient(ellipse 55% 45% at 50% 50%, rgba(255, 236, 205, 0.22), transparent 70%),
    radial-gradient(ellipse 90% 70% at 50% 50%, rgba(120, 150, 255, 0.10), transparent 75%);
}
.haze[data-haze="1"] {
  background:
    radial-gradient(ellipse 60% 50% at 50% 52%, rgba(255, 150, 70, 0.20), transparent 72%),
    radial-gradient(ellipse 95% 75% at 45% 50%, rgba(255, 90, 40, 0.09), transparent 78%);
}
.haze[data-haze="2"] {
  background:
    radial-gradient(ellipse 70% 55% at 50% 50%, rgba(235, 80, 40, 0.17), transparent 74%),
    radial-gradient(ellipse 100% 80% at 55% 50%, rgba(160, 40, 30, 0.12), transparent 80%);
}
.haze.is-on { opacity: 1; }

/* The "tiny glowing point". JS drives --core-scale / --core-opacity. */
#core {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 36px;
  height: 36px;
  margin: -18px 0 0 -18px;
  border-radius: 50%;
  background: radial-gradient(circle,
    #fff 0%, #fff 6%,
    rgba(255, 246, 232, 0.88) 12%,
    rgba(255, 214, 160, 0.26) 36%,
    rgba(255, 200, 140, 0) 70%);
  opacity: var(--core-opacity, 0);
  transform: scale(var(--core-scale, 1));
  will-change: transform, opacity;
}

#flash {
  position: absolute;
  inset: 0;
  background: #fff3df;
  opacity: 0;
  will-change: opacity;
}

#vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0, 0, 0, 0.68) 100%);
}

/* ==========================================================================
   Opening screen
   ========================================================================== */

#welcome {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(14px, 3vh, 28px);
  padding: var(--pad);
  text-align: center;
  background: var(--black);
  opacity: 1;
  transition: opacity 1.5s ease;
}
#welcome.is-leaving { opacity: 0; pointer-events: none; }

.wl-title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(1.9rem, 9vw, 5.6rem);
  letter-spacing: 0.42em;
  /* the trailing letter-space would shift the word off-center */
  margin-right: -0.42em;
  color: #f4f7ff;
  text-shadow:
    0 0 18px rgba(var(--glow-cool), 0.55),
    0 0 60px rgba(var(--glow-cool), 0.28);
  opacity: 0;
  animation:
    wl-in 3.2s ease 0.5s forwards,
    wl-breathe 6s ease-in-out 3.7s infinite;
}

.wl-tagline {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: clamp(1.05rem, 3.4vw, 1.55rem);
  letter-spacing: 0.08em;
  color: var(--ink-dim);
  opacity: 0;
  animation: wl-in 3s ease 2.2s forwards;
}

.wl-enter {
  position: relative;
  margin-top: clamp(18px, 6vh, 56px);
  min-height: 48px;
  padding: 14px 18px;
  display: inline-flex;
  align-items: center;
  gap: 0.9em;
  background: none;
  border: 0;
  cursor: pointer;
  font-family: var(--font-ui);
  font-weight: 300;
  font-size: clamp(0.78rem, 2.6vw, 0.95rem);
  letter-spacing: 0.34em;
  color: var(--ink);
  opacity: 0;
  animation:
    wl-in 2.6s ease 4s forwards,
    wl-pulse 3.8s ease-in-out 6.6s infinite;
  transition: color 0.4s ease, text-shadow 0.4s ease;
}
.wl-enter .br {
  display: inline-block;
  font-weight: 200;
  font-size: 1.5em;
  line-height: 1;
  color: rgba(var(--glow-warm), 0.85);
  transition: transform 0.6s cubic-bezier(.2, .8, .2, 1);
}
.wl-enter:hover, .wl-enter:focus-visible {
  color: #fff;
  text-shadow: 0 0 14px rgba(var(--glow-warm), 0.8);
}
.wl-enter:hover .br:first-child, .wl-enter:focus-visible .br:first-child { transform: translateX(-8px); }
.wl-enter:hover .br:last-child,  .wl-enter:focus-visible .br:last-child  { transform: translateX(8px); }
.wl-enter:active { transform: scale(0.98); }

@keyframes wl-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes wl-breathe {
  0%, 100% { text-shadow: 0 0 18px rgba(var(--glow-cool), 0.45), 0 0 60px rgba(var(--glow-cool), 0.22); }
  50%      { text-shadow: 0 0 26px rgba(var(--glow-cool), 0.8),  0 0 90px rgba(var(--glow-cool), 0.40); }
}
@keyframes wl-pulse {
  0%, 100% { opacity: 0.72; }
  50%      { opacity: 1; }
}

/* ==========================================================================
   Pre-bang text
   ========================================================================== */

#intro {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(50% + 56px);
  z-index: 10;
  padding: 0 var(--pad);
  text-align: center;
  pointer-events: none;
}
.in-era, .in-sub {
  opacity: 0;
  transition: opacity 2s ease;
}
.in-era {
  font-family: var(--font-display);
  font-size: clamp(0.95rem, 3.8vw, 1.7rem);
  letter-spacing: 0.3em;
  margin-right: -0.3em;
  color: var(--gold);
  text-shadow: 0 0 22px rgba(var(--glow-warm), 0.45);
}
.in-sub {
  margin: 14px auto 0;
  max-width: 34ch;
  font-family: var(--font-serif);
  font-size: clamp(1.1rem, 3.6vw, 1.5rem);
  line-height: 1.45;
  color: var(--ink-dim);
}
#app.show-era .in-era { opacity: 1; }
#app.show-sub .in-sub { opacity: 1; }
#app.hide-intro .in-era, #app.hide-intro .in-sub { opacity: 0; transition-duration: 0.5s; }

/* ==========================================================================
   Event panel
   ========================================================================== */

#event-panel {
  position: absolute;
  z-index: 10;
  left: calc(var(--pad) + var(--safe-l));
  right: calc(var(--pad) + var(--safe-r));
  bottom: calc(var(--safe-b) + 150px);
  max-width: 36rem;
  padding: 14px 18px 15px;
  border: 1px solid rgba(234, 240, 251, 0.2);
  border-left: 2px solid rgba(var(--glow-warm), 0.78);
  border-radius: 12px;
  background: rgba(3, 7, 14, 0.91);
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.48);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.9s ease, transform 0.9s ease;
  pointer-events: none;
}
#event-panel { isolation: isolate; }
#event-panel::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(135deg, rgba(10, 18, 30, 0.3), transparent 72%);
  pointer-events: none;
}
#event-panel.is-in { opacity: 1; transform: none; pointer-events: auto; }
#event-panel.is-swapping { opacity: 0; transform: translateY(6px); transition-duration: 0.35s; }

.ep-when {
  font-family: var(--font-ui);
  font-weight: 400;
  font-size: 0.72rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
}

.ep-title-row { display: flex; align-items: flex-start; gap: 8px; }
.ep-title-row .ep-title { flex: 1; min-width: 0; }
.ep-collapse {
  flex: 0 0 30px; display: grid; place-items: center; width: 30px; height: 30px;
  margin-top: 3px; padding: 0; border: 1px solid rgba(234, 240, 251, 0.28);
  border-radius: 50%; background: rgba(234, 240, 251, 0.06); color: var(--ink-dim);
  cursor: pointer; transition: color 0.2s ease, background 0.2s ease;
}
.ep-collapse:hover, .ep-collapse:focus-visible { color: #fff; background: rgba(234, 240, 251, 0.15); }
.ep-collapse svg { transform: rotate(180deg); transition: transform 0.2s ease; }
#event-panel.is-collapsed .ep-collapse svg { transform: rotate(0); }
#event-panel.is-collapsed #ep-details,
#event-panel.is-collapsed #btn-science,
#event-panel.is-collapsed #replay-btn { display: none !important; }
#event-panel.is-collapsed .ep-actions { margin-top: 6px; }
#event-panel.is-collapsed .ep-nav { margin-left: auto; }
.ep-title {
  margin-top: 8px;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(1.35rem, 4.6vw, 2.2rem);
  letter-spacing: 0.08em;
  line-height: 1.2;
  color: #f6f8ff;
  text-shadow: 0 0 24px rgba(var(--glow-cool), 0.3);
}
.ep-text {
  margin-top: 10px;
  max-width: 52ch;
  font-family: var(--font-serif);
  font-size: clamp(1.08rem, 3.3vw, 1.3rem);
  line-height: 1.5;
  color: rgba(245, 248, 255, 0.96);
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
}
.ep-note {
  margin-top: 12px;
  max-width: 60ch;
  font-family: var(--font-ui);
  font-weight: 300;
  font-size: 0.8rem;
  line-height: 1.55;
  color: rgba(225, 233, 246, 0.82);
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
}
.ep-replay {
  margin-top: 14px;
  min-height: 44px;
  padding: 10px 2px;
  background: none;
  border: 0;
  border-bottom: 1px solid rgba(var(--glow-warm), 0.45);
  cursor: pointer;
  font-family: var(--font-ui);
  font-weight: 300;
  font-size: 0.8rem;
  letter-spacing: 0.14em;
  color: var(--ink-dim);
  transition: color 0.3s ease, border-color 0.3s ease;
}
.ep-replay:hover, .ep-replay:focus-visible { color: #fff; border-color: rgba(var(--glow-warm), 0.95); }

/* ==========================================================================
   Timeline
   ========================================================================== */

#timeline {
  position: absolute;
  z-index: 12;
  left: calc(var(--pad) + var(--safe-l));
  right: calc(var(--pad) + var(--safe-r));
  bottom: calc(var(--safe-b) + 18px);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 1.4s ease, transform 1.4s ease;
  pointer-events: none;
}
#app.show-hud #timeline { opacity: 1; transform: none; pointer-events: auto; }

.tl-readout {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
  margin-bottom: 14px;
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.tl-age { color: var(--ink); font-weight: 400; text-transform: none; letter-spacing: 0.06em; font-size: 0.8rem; }
.tl-scale { margin-left: auto; letter-spacing: 0.08em; text-transform: none; font-size: 0.68rem; }

.tl-track {
  --n: 3;
  --p: 0;
  position: relative;
  height: 70px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.tl-track::before,
.tl-track::after {
  content: "";
  position: absolute;
  top: calc(var(--dot) / 2);
  left: calc(var(--dot) / 2);
  height: 1px;
  margin-top: -0.5px;
}
.tl-track::before {
  right: calc(var(--dot) / 2);
  background: rgba(234, 240, 251, 0.18);
}
.tl-track::after {
  width: calc((100% - var(--dot)) * var(--p));
  background: linear-gradient(90deg, rgba(var(--glow-warm), 0.3), rgba(var(--glow-warm), 0.95));
  box-shadow: 0 0 10px rgba(var(--glow-warm), 0.6);
}

/* --pos (0..1) is set per node in JS. The translate trick keeps the dot of
   the first node at the left edge and the dot of the last node at the right. */
.tl-node {
  position: absolute;
  top: 0;
  left: calc(var(--pos) * 100%);
  transform: translateX(calc(var(--pos) * -100%));
  width: max-content;
  max-width: 6.6rem;
}
.tl-node[data-edge="first"] { text-align: left; }
.tl-node[data-edge="mid"]   { text-align: center; }
.tl-node[data-edge="last"]  { text-align: right; }

.tl-btn {
  display: block;
  width: 100%;
  min-height: 44px;                 /* touch target */
  margin-top: -15px;
  padding: 15px 0 0;
  background: none;
  border: 0;
  text-align: inherit;
  cursor: pointer;
}
.tl-btn:disabled { cursor: default; }

.tl-dot {
  display: block;
  width: var(--dot);
  height: var(--dot);
  margin-left: calc(var(--pos) * (100% - var(--dot)));
  border-radius: 50%;
  border: 1px solid rgba(234, 240, 251, 0.3);
  background: #05060a;
  transition: background 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease, transform 0.6s ease;
}
.tl-when, .tl-name { display: block; transition: color 0.6s ease; }
.tl-when {
  margin-top: 10px;
  font-size: 0.6rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.tl-name {
  margin-top: 3px;
  font-family: var(--font-serif);
  font-size: 0.98rem;
  line-height: 1.2;
  color: rgba(234, 240, 251, 0.3);
}

.tl-node.is-reached .tl-dot { border-color: rgba(var(--glow-warm), 0.85); background: rgba(var(--glow-warm), 0.35); }
.tl-node.is-reached .tl-name { color: var(--ink-dim); }
.tl-node.is-reached .tl-btn:hover .tl-name { color: #fff; }
.tl-node.is-active .tl-dot {
  background: #fff3df;
  border-color: #fff3df;
  transform: scale(1.12);
  box-shadow: 0 0 12px 2px rgba(var(--glow-warm), 0.8);
}
.tl-node.is-active .tl-when { color: var(--gold); }
.tl-node.is-active .tl-name { color: #fff; }

/* ==========================================================================
   Controls + disclaimer
   ========================================================================== */

#controls {
  position: absolute;
  z-index: 20;
  top: calc(var(--safe-t) + 10px);
  right: calc(var(--pad) + var(--safe-r) - 8px);
  display: flex;
  align-items: center;
  gap: 6px;
  opacity: 0;
  transition: opacity 1.6s ease;
  pointer-events: none;
}
#app.show-hud #controls { opacity: 1; pointer-events: auto; }
#app.show-controls #controls { opacity: 1; pointer-events: auto; }

.ctl-mute {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  background: none;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  color: var(--ink-dim);
  transition: color 0.3s ease;
}
.ctl-mute:hover, .ctl-mute:focus-visible { color: #fff; }
.ctl-mute .slash { opacity: 0; }
.ctl-mute.is-muted .wave { opacity: 0; }
.ctl-mute.is-muted .slash { opacity: 1; }

.ctl-volume {
  -webkit-appearance: none;
  appearance: none;
  width: clamp(72px, 18vw, 110px);
  height: 44px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
.ctl-volume::-webkit-slider-runnable-track { height: 2px; background: rgba(234, 240, 251, 0.25); border-radius: 2px; }
.ctl-volume::-moz-range-track { height: 2px; background: rgba(234, 240, 251, 0.25); border-radius: 2px; }
.ctl-volume::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px; margin-top: -6px;
  border-radius: 50%; border: 0;
  background: #fff3df;
  box-shadow: 0 0 10px rgba(var(--glow-warm), 0.8);
}
.ctl-volume::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%; border: 0;
  background: #fff3df;
  box-shadow: 0 0 10px rgba(var(--glow-warm), 0.8);
}

#project-speed {
  position: absolute; z-index: 20; top: calc(var(--safe-t) + 58px);
  right: calc(var(--pad) + var(--safe-r) - 8px);
  display: flex; align-items: center; gap: 8px;
  min-height: 34px; padding: 3px 9px;
  border: 1px solid rgba(234, 240, 251, 0.2); border-radius: 18px;
  background: rgba(4, 9, 17, 0.58); color: var(--ink-dim);
  font: 500 0.68rem var(--font-ui); letter-spacing: 0.08em;
  opacity: 0; transition: opacity 1.6s ease; pointer-events: none;
  -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
}
#app.show-hud #project-speed, #app.show-controls #project-speed { opacity: 1; pointer-events: auto; }
#project-speed input { width: clamp(60px, 11vw, 82px); margin: 0; accent-color: #fff3df; cursor: pointer; }
#project-speed output { min-width: 2.7em; text-align: right; color: #fff3df; letter-spacing: 0.02em; }

.disclaimer {
  position: absolute;
  z-index: 20;
  top: calc(var(--safe-t) + 16px);
  left: calc(var(--pad) + var(--safe-l));
  max-width: min(22rem, calc(100% - 11rem));
  font-size: 0.66rem;
  font-weight: 300;
  line-height: 1.5;
  letter-spacing: 0.04em;
  color: var(--ink-faint);
  opacity: 0;
  transition: opacity 1.6s ease;
  pointer-events: none;
}
#app.show-hud .disclaimer, #app.show-controls .disclaimer { opacity: 1; }

.noscript { position: fixed; inset: 0; display: grid; place-items: center; background: #000; color: var(--ink-dim); font-family: var(--font-serif); z-index: 99; }

/* ==========================================================================
   Responsive
   ========================================================================== */

@media (max-width: 640px) {
  :root { --dot: 12px; }
  #event-panel { bottom: calc(var(--safe-b) + 142px); padding-left: 14px; }
  .ep-note { font-size: 0.74rem; }
  .tl-node { max-width: 6.1rem; }
  .tl-when { font-size: 0.55rem; letter-spacing: 0.1em; }
  .tl-name { font-size: 0.9rem; }
  .tl-scale { display: none; }
  .disclaimer { font-size: 0.62rem; max-width: calc(100% - 9.5rem); }
}

@media (max-height: 560px) and (orientation: landscape) {
  #event-panel { bottom: calc(var(--safe-b) + 128px); max-width: 28rem; }
  .ep-note { display: none; }
  .ep-text { font-size: 1rem; }
}

@media (min-width: 1100px) {
  #event-panel { bottom: calc(var(--safe-b) + 170px); }
  .tl-node { max-width: 10rem; }
  .tl-name { font-size: 1.1rem; }
  .tl-when { font-size: 0.66rem; }
}

/* ==========================================================================
   Reduced motion
   ========================================================================== */

@media (prefers-reduced-motion: reduce) {
  .wl-title, .wl-tagline, .wl-enter { animation: wl-in-rm 1.2s ease forwards; }
  .wl-title { animation-delay: 0.2s; }
  .wl-tagline { animation-delay: 0.6s; }
  .wl-enter { animation-delay: 1s; }
  .wl-enter .br { transition: none; }
  .wl-enter:hover .br { transform: none !important; }
  #event-panel, #timeline { transform: none; }
  .haze { transition-duration: 1.5s; }
}
@keyframes wl-in-rm { from { opacity: 0; } to { opacity: 1; } }

/* ==========================================================================
   STAGE 2 — chapters, dock, science drawer, figures, tools, extended timeline
   (appended: these rules extend the Stage 1 identity, they do not replace it)
   ========================================================================== */

:root { --tl-h: 176px; }

/* ---- scene canvas + live caption ---- */
#scene-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  opacity: 0; transition: opacity 1.1s ease; pointer-events: none;
}
.scene-caption {
  position: absolute; z-index: 11;
  top: calc(var(--safe-t) + 56px); left: 50%; transform: translateX(-50%);
  width: min(44rem, calc(100% - 2 * var(--pad)));
  text-align: center;
  font-family: var(--font-serif); font-style: italic;
  font-size: clamp(0.95rem, 2.6vw, 1.12rem); line-height: 1.35;
  color: rgba(234, 240, 251, 0.82); text-shadow: 0 0 14px #000, 0 0 4px #000;
  opacity: 0; transition: opacity 0.8s ease; pointer-events: none;
}
.scene-caption.is-on { opacity: 1; }

/* ---- chapter panel ---- */
#event-panel {
  bottom: calc(var(--safe-b) + var(--tl-h));
  max-width: min(28rem, calc(100vw - 26rem - 2 * var(--pad)));
  min-width: min(20rem, 100%);
}
.ep-vis { margin-top: 12px; }
.vis-tag {
  display: inline-block; padding: 3px 9px; border-radius: 99px;
  font-size: 0.62rem; letter-spacing: 0.16em; font-weight: 500;
  border: 1px solid rgba(234, 240, 251, 0.3); color: var(--ink-dim);
}
.vis-tag.real { color: #9bffc8; border-color: rgba(155, 255, 200, 0.55); }
.vis-tag.art  { color: #ffd9a3; border-color: rgba(255, 217, 163, 0.5); }
.ep-note { margin-top: 8px; }
.ep-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 12px; }
.btn-sci {
  min-height: 44px; padding: 10px 16px; display: inline-flex; align-items: center; gap: 10px;
  background: rgba(255, 217, 163, 0.08); border: 1px solid rgba(255, 217, 163, 0.5); border-radius: 99px;
  font-family: var(--font-ui); font-weight: 400; font-size: 0.72rem; letter-spacing: 0.18em; color: var(--gold); cursor: pointer;
  transition: background 0.3s ease, color 0.3s ease;
}
.btn-sci:hover, .btn-sci:focus-visible, .btn-sci[aria-expanded="true"] { background: rgba(255, 217, 163, 0.2); color: #fff; }
.btn-sci .plus { font-size: 1.1rem; line-height: 1; }
.ep-nav { display: inline-flex; gap: 6px; }
.btn-nav {
  min-height: 44px; min-width: 44px; padding: 8px 14px; background: none; cursor: pointer;
  border: 1px solid rgba(234, 240, 251, 0.25); border-radius: 99px;
  font-family: var(--font-ui); font-size: 0.78rem; letter-spacing: 0.08em; color: var(--ink);
  transition: border-color 0.3s ease, background 0.3s ease, opacity 0.3s ease;
}
.btn-nav:hover:not(:disabled), .btn-nav:focus-visible { border-color: rgba(var(--glow-warm), 0.9); background: rgba(var(--glow-warm), 0.1); }
.btn-nav:disabled { opacity: 0.3; cursor: default; }
.btn-next { border-color: rgba(var(--glow-warm), 0.55); }

/* ---- extended timeline ---- */
.tl-readout { align-items: center; }
.tl-age { text-transform: none; letter-spacing: 0.05em; font-size: 0.8rem; }
.tl-ago, .tl-journey { text-transform: none; letter-spacing: 0.05em; font-size: 0.72rem; color: var(--ink-faint); }
.tl-views { margin-left: auto; display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.tl-jump-label { font-size: 0.58rem; letter-spacing: 0.06em; text-transform: none; }
.tl-jump {
  max-width: min(9.5rem, 30vw); min-height: 30px; padding: 4px 22px 4px 8px;
  border: 1px solid rgba(234, 240, 251, 0.22); border-radius: 99px;
  background: rgba(4, 9, 17, 0.88); color: var(--ink-dim);
  font: 500 0.62rem var(--font-ui); cursor: pointer;
}
.tl-jump:focus-visible { outline: 2px solid rgba(var(--glow-warm), 0.9); outline-offset: 2px; }
.tl-views button {
  min-height: 28px; padding: 4px 10px; background: none; cursor: pointer;
  border: 1px solid rgba(234, 240, 251, 0.18); border-radius: 99px;
  font-family: var(--font-ui); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint);
}
.tl-views button[aria-pressed="true"] { color: #fff; border-color: rgba(var(--glow-warm), 0.75); }
.tl-readout { margin-bottom: 4px; }
.tl-axiswrap { position: relative; height: 30px; margin: 0 calc(var(--dot) / 2); }
.tl-axis { position: absolute; left: 0; right: 0; bottom: 6px; height: 1px; background: rgba(234, 240, 251, 0.3); }
.tl-tick { position: absolute; top: 0; transform: translateX(-50%); }
.tl-tick:first-child { transform: none; }
.tl-tick:last-child { transform: translateX(-100%); }
.tl-tick i { position: absolute; left: 50%; top: -9px; width: 1px; height: 6px; background: rgba(234, 240, 251, 0.4); }
.tl-tick:first-child i { left: 0; }
.tl-tick:last-child i { left: 100%; }
.tl-tick b { position: absolute; bottom: 8px; left: 0; transform: translateX(-50%); white-space: nowrap; font-weight: 400; font-size: 0.58rem; letter-spacing: 0.1em; color: var(--ink-faint); }
.tl-tick:first-child b { transform: none; }
.tl-tick:last-child b { transform: translateX(-100%); left: 100%; }
.tl-links { display: block; width: 100%; height: 22px; overflow: visible; }
.tl-link { stroke: rgba(234, 240, 251, 0.16); fill: rgba(234, 240, 251, 0.3); stroke-width: 1; }
.tl-link.is-reached { stroke: rgba(var(--glow-warm), 0.45); fill: rgba(var(--glow-warm), 0.7); }
.tl-link.is-active { stroke: rgba(var(--glow-warm), 0.95); fill: #fff3df; }
.tl-track { height: 78px; margin-top: 0; }
.tl-node { max-width: calc(100% / var(--n)); }
.tl-when { font-size: 0.54rem; letter-spacing: 0.08em; }
.tl-name { font-size: 0.86rem; }
.tl-node.is-active .tl-btn:focus-visible { outline-offset: 2px; }

@media (min-width: 1100px) { .tl-node { max-width: calc(100% / var(--n)); } .tl-name { font-size: 0.95rem; } .tl-when { font-size: 0.58rem; } }
@media (max-width: 860px) { .tl-when, .tl-name { display: none; } .tl-track { height: 30px; } .tl-ago { display: none; } }
@media (max-width: 420px) { .tl-jump-label { display: none; } .tl-views button { padding-right: 7px; padding-left: 7px; font-size: 0.56rem; } }

/* ---- dock (real image + interactive) ---- */
.dock {
  position: absolute; z-index: 14;
  top: calc(var(--safe-t) + 110px); right: calc(var(--pad) + var(--safe-r));
  bottom: calc(var(--safe-b) + var(--tl-h));
  width: min(23rem, calc(100vw - 2 * var(--pad)));
  display: flex; flex-direction: column;
  background: rgba(5, 6, 12, 0.74); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(234, 240, 251, 0.12); border-radius: 12px;
  opacity: 0; transform: translateX(14px); transition: opacity 0.9s ease, transform 0.9s ease; pointer-events: none;
}
#app.show-hud .dock { opacity: 1; transform: none; pointer-events: auto; }
.dock:not(.is-open) { bottom: auto; }
.dock:not(.is-open) .dock-pane { display: none; }
.dock-tabs { display: flex; align-items: center; gap: 2px; padding: 4px 6px 0; border-bottom: 1px solid rgba(234, 240, 251, 0.1); }
.dock-tab {
  min-height: 44px; padding: 8px 12px; background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer;
  font-family: var(--font-ui); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint);
}
.dock-tab[aria-selected="true"] { color: #fff; border-bottom-color: rgba(var(--glow-warm), 0.9); }
.dock-toggle { margin-left: auto; width: 44px; height: 44px; background: none; border: 0; color: var(--ink-dim); font-size: 1.3rem; cursor: pointer; }
.dock-pane { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: rgba(234,240,251,.25) transparent; }
.dock-pane[hidden] { display: none; }

/* ---- Explore the science drawer ---- */
.science {
  position: absolute; z-index: 26;
  top: calc(var(--safe-t) + 60px); right: calc(var(--pad) + var(--safe-r)); bottom: calc(var(--safe-b) + var(--tl-h));
  width: min(34rem, calc(100vw - 2 * var(--pad)));
  display: flex; flex-direction: column;
  background: rgba(4, 5, 10, 0.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(var(--glow-warm), 0.3); border-radius: 12px;
  box-shadow: 0 10px 50px rgba(0, 0, 0, 0.7);
  animation: sci-in 0.4s ease both;
}
@keyframes sci-in { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
.science-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 10px; border-bottom: 1px solid rgba(234, 240, 251, 0.1); }
.science-kicker { font-size: 0.62rem; letter-spacing: 0.22em; color: var(--gold); }
.science-title { margin-top: 6px; font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; letter-spacing: 0.06em; color: #f6f8ff; }
.science-close { width: 44px; height: 44px; margin: -6px -8px 0 0; background: none; border: 0; font-size: 1.8rem; line-height: 1; color: var(--ink-dim); cursor: pointer; }
.science-close:hover, .science-close:focus-visible { color: #fff; }
.science-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 6px 18px 22px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: rgba(234,240,251,.25) transparent; }
.sci-sec { margin-top: 18px; }
.sci-sec h3 { font-family: var(--font-ui); font-weight: 500; font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.sci-p { font-family: var(--font-serif); font-size: 1.08rem; line-height: 1.5; color: rgba(234, 240, 251, 0.9); margin-bottom: 10px; }
.sci-list, .bul { margin: 0; padding-left: 1.1em; }
.sci-list { list-style: none; padding: 0; }
.sci-list li { margin-bottom: 12px; font-size: 0.86rem; line-height: 1.5; color: rgba(234, 240, 251, 0.82); }
.sci-list .yrs { color: var(--ink-faint); font-size: 0.78rem; }
.idea-h { margin-bottom: 3px; }
.bul li { margin-bottom: 6px; font-size: 0.86rem; line-height: 1.5; color: rgba(234, 240, 251, 0.82); }
.refs li { word-break: break-word; }
.ext { color: #9fc6ff; text-decoration: none; border-bottom: 1px solid rgba(159, 198, 255, 0.35); font-size: 0.8rem; }
.ext:hover, .ext:focus-visible { color: #fff; border-bottom-color: #fff; }

/* status badges */
.st { display: inline-block; padding: 2px 7px; border-radius: 99px; font-size: 0.56rem; letter-spacing: 0.12em; font-weight: 500; border: 1px solid currentColor; white-space: nowrap; vertical-align: middle; }
.st-obs { color: #8dffbc; } .st-meas { color: #8fc4ff; } .st-theory { color: #c7a8ff; }
.st-sim { color: #7fe8ff; } .st-hyp { color: #ffcf7a; } .st-open { color: #ff9aa8; }

/* key/value lists */
.kv { margin: 0; }
.kv dt { margin-top: 10px; font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kv dd { margin: 3px 0 0; font-size: 0.86rem; line-height: 1.5; color: rgba(234, 240, 251, 0.9); }

/* ---- figures ---- */
.fig { margin: 0; }
.fig-type { display: inline-block; margin: 0 0 8px; padding: 3px 9px; border-radius: 99px; font-size: 0.6rem; letter-spacing: 0.16em; font-weight: 500; border: 1px solid; }
.fig-type.real { color: #9bffc8; border-color: rgba(155, 255, 200, 0.55); }
.fig-type.art { color: #ffd9a3; border-color: rgba(255, 217, 163, 0.5); }
.fig-frame { min-height: 120px; border-radius: 8px; background: #05060a; border: 1px solid rgba(234, 240, 251, 0.1); display: grid; place-items: center; overflow: hidden; color: var(--ink-faint); font-size: 0.8rem; text-align: center; }
.fig-frame img { display: block; width: 100%; max-height: 38vh; object-fit: contain; opacity: 0; transition: opacity 0.8s ease; }
.fig-frame.fig-ready img { opacity: 1; }
.fig-loading { animation: fig-pulse 1.6s ease-in-out infinite; }
@keyframes fig-pulse { 50% { opacity: 0.55; } }
.fig-fail { padding: 18px; gap: 10px; }
.fig-cap { margin-top: 10px; }
.fig-title { font-size: 0.9rem; font-weight: 500; line-height: 1.35; color: #fff; }
.fig-meta { margin-top: 4px; font-size: 0.7rem; line-height: 1.5; color: var(--ink-faint); }
.fig-credit { margin-top: 4px; font-size: 0.7rem; line-height: 1.5; color: var(--ink-faint); }
.fig-desc { margin-top: 8px; font-size: 0.78rem; line-height: 1.5; color: rgba(234, 240, 251, 0.7); }
.fig-note { margin-top: 8px; padding-left: 10px; border-left: 2px solid rgba(var(--glow-warm), 0.5); font-size: 0.78rem; line-height: 1.5; color: rgba(255, 233, 200, 0.85); }
.fig-links { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.figs .chips { margin-bottom: 10px; }

/* ---- tools ---- */
.tool-h { margin: 16px 0 8px; font-family: var(--font-ui); font-weight: 500; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
.tool > .tool-h:first-child { margin-top: 0; }
.tool-p, .tool-note { font-size: 0.8rem; line-height: 1.55; color: rgba(234, 240, 251, 0.8); margin: 8px 0 0; }
.tool-note { color: var(--ink-faint); }
.tool-out { margin: 10px 0 0; font-size: 0.82rem; line-height: 1.5; color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips-sub { margin-top: 8px; align-items: center; }
.chips-l { font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); margin-right: 4px; }
.chip, .btn-mini {
  min-height: 36px; padding: 6px 12px; background: none; cursor: pointer;
  border: 1px solid rgba(234, 240, 251, 0.22); border-radius: 99px;
  font-family: var(--font-ui); font-size: 0.74rem; letter-spacing: 0.04em; color: var(--ink);
  transition: background 0.25s ease, border-color 0.25s ease;
}
.chip:hover, .chip:focus-visible, .btn-mini:hover, .btn-mini:focus-visible { border-color: rgba(var(--glow-warm), 0.8); }
.chip.is-on { background: rgba(var(--glow-warm), 0.18); border-color: rgba(var(--glow-warm), 0.85); color: #fff; }
.btn-mini { margin-top: 10px; font-size: 0.7rem; min-height: 34px; }
.slider-l { display: block; font-size: 0.78rem; color: rgba(234, 240, 251, 0.85); margin-bottom: 4px; }
.tool input[type="range"] { width: 100%; height: 36px; background: transparent; accent-color: #ffd9a3; cursor: pointer; }
.check { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: 0.82rem; color: rgba(234, 240, 251, 0.9); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: #ffd9a3; }
.keylist { margin: 0; padding-left: 1.1em; font-size: 0.8rem; line-height: 1.55; color: rgba(234, 240, 251, 0.82); }
.keylist b { color: #fff; font-weight: 500; }
.bars { display: grid; gap: 6px; }
.bar { padding: 6px 10px; border-radius: 6px; font-size: 0.74rem; color: #05060a; white-space: nowrap; overflow: hidden; }
.bar-dm { background: #a58bff; } .bar-gas { background: #ff9a70; }
.acc { display: grid; gap: 6px; }
.acc-it { border: 1px solid rgba(234, 240, 251, 0.14); border-radius: 8px; }
.acc-b { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; background: none; border: 0; cursor: pointer; text-align: left; font-family: var(--font-ui); font-size: 0.8rem; color: var(--ink); }
.acc-b[aria-expanded="true"] { color: #fff; }
.acc-body { margin: 0; padding: 0 12px 12px; font-size: 0.8rem; line-height: 1.55; color: rgba(234, 240, 251, 0.8); }
.elcard { margin-top: 10px; padding: 12px; border: 1px solid rgba(234, 240, 251, 0.14); border-radius: 10px; background: rgba(255, 255, 255, 0.03); }
.elcard-top { display: flex; align-items: center; gap: 14px; }
.nucwrap { flex: none; width: 112px; }
.nucsvg { display: block; width: 100%; height: auto; }
.elsym b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 2.2rem; color: #fff; line-height: 1; }
.elsym small { color: var(--ink-faint); font-size: 0.72rem; }
.objcard { margin-top: 14px; }
.obj-name { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; letter-spacing: 0.06em; color: #fff; }
.obj-cls { margin: 2px 0 10px; font-size: 0.78rem; color: var(--gold); }
.obj-h { margin: 14px 0 6px; font-size: 0.64rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); font-weight: 500; }

/* ---- phones and small tablets: panels become full-width sheets ---- */
@media (max-width: 768px) {
  #event-panel { max-width: none; right: calc(var(--pad) + var(--safe-r)); padding-left: 12px; }
  .ep-note { font-size: 0.72rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ep-text { font-size: 1.02rem; }

.ep-title { font-size: 1.3rem; }
  .scene-caption { top: calc(var(--safe-t) + 62px); font-size: 0.92rem; }
  .dock { left: 8px; right: 8px; width: auto; top: calc(var(--safe-t) + 112px); }
  .dock:not(.is-open) { left: auto; right: 8px; top: calc(var(--safe-t) + 58px); width: auto; }
  .dock:not(.is-open) .dock-tab { padding: 8px 10px; }
  .science { left: 8px; right: 8px; width: auto; top: calc(var(--safe-t) + 58px); }
  .fig-frame img { max-height: 30vh; }
  .tl-views button { padding: 4px 8px; font-size: 0.58rem; }
  .btn-sci { font-size: 0.66rem; padding: 8px 12px; letter-spacing: 0.12em; }
}
@media (max-height: 560px) and (orientation: landscape) {
  .ep-note { display: none; }
  .dock { top: calc(var(--safe-t) + 52px); }
}
@media (prefers-reduced-motion: reduce) {
  .science { animation: none; }
  .dock, #scene-canvas, .scene-caption { transition-duration: 0.01s; }
  .fig-loading { animation: none; }
}

/* timeline chips: only the active chapter shows its time range (avoids overlap) */
.tl-when { display: none; }
.tl-node.is-active .tl-when { display: block; }
@media (max-width: 860px) {
  .tl-node { width: calc(100% / var(--n)); }       /* labels are hidden: give each dot a proper 32px+ touch target */
  .tl-node.is-active .tl-when { display: none; }
}

/* compact panel (Solar System chapter): keep the scene unobstructed */
#event-panel.is-compact .ep-text, #event-panel.is-compact .ep-note, #event-panel.is-compact .ep-vis { display: none; }

/* Compact translucent info card, kept in the foreground on every chapter. */
#event-panel.is-glass-panel {
  left: calc(var(--pad) + var(--safe-l)); right: auto;
  bottom: calc(var(--safe-b) + var(--tl-h) + 10px);
  width: min(18rem, calc(100vw - 2 * var(--pad) - var(--safe-l) - var(--safe-r)));
  max-width: 18rem; min-width: 0; padding: 9px 13px 10px;
  background: rgba(4, 9, 17, 0.46);
  border-color: rgba(234, 240, 251, 0.22);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}
#event-panel.is-glass-panel::before { background: linear-gradient(135deg, rgba(10, 18, 30, 0.16), transparent 76%); }
#event-panel.is-glass-panel .ep-when { font-size: 0.61rem; letter-spacing: 0.16em; }

#event-panel.is-glass-panel .ep-title { margin-top: 4px; font-size: clamp(1.12rem, 2.6vw, 1.45rem); letter-spacing: 0.05em; }
#event-panel.is-glass-panel .ep-text {
  margin-top: 5px; font-size: 0.92rem; line-height: 1.32;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}
#event-panel.is-glass-panel .ep-vis { margin: 5px 0 0; }
#event-panel.is-glass-panel .vis-tag { padding: 2px 7px; font-size: 0.55rem; }
#event-panel.is-glass-panel .ep-note {
  margin-top: 5px; font-size: 0.63rem; line-height: 1.28;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden;
}
#event-panel.is-glass-panel .ep-actions { margin-top: 7px; gap: 6px 10px; }
#event-panel.is-glass-panel .btn-sci,
#event-panel.is-glass-panel .btn-nav { min-height: 38px; }
#event-panel.is-glass-panel .btn-sci { padding: 7px 11px; font-size: 0.62rem; }
#event-panel.is-glass-panel .ep-replay { min-height: 34px; margin-top: 6px; padding: 6px 2px; font-size: 0.68rem; }
@media (max-width: 768px) {
  #event-panel.is-glass-panel {
    left: calc(10px + var(--safe-l)); right: auto; bottom: calc(var(--safe-b) + var(--tl-h) + 8px);
    width: min(16rem, calc(100vw - 20px - var(--safe-l) - var(--safe-r)));
    max-width: none; padding: 8px 11px 9px;
  }

#event-panel.is-glass-panel .ep-title { font-size: 1.08rem; }
  #event-panel.is-glass-panel .ep-text { font-size: 0.85rem; -webkit-line-clamp: 2; }

/* ===== script.js ===== */
/* ==========================================================================
   EYEWITNESS — Stages 1 + 2: welcome, Big Bang, 11-chapter journey to the Solar System
   (this file is the director; chapters.js, images.js, scenes.js, solar.js and ui.js
   hold the Stage 2 content, NASA image loader, visualizations, explorer and UI)
   --------------------------------------------------------------------------
   Architecture (everything lives in one closure; later stages extend it):

     CONFIG        tunable numbers
     EVENTS        the timeline as DATA. Stage 2+ appends entries here; the
                   timeline UI, event panel, tint and audio mood all follow.
     Listeners     one registry for every DOM listener  -> clean teardown
     Timers        one registry for every setTimeout    -> clean teardown
     ParticleField typed-array particle data shared by both renderers
     GLRenderer    Three.js points + custom shader (preferred)
     Canvas2DRenderer   same simulation projected on a 2D canvas (fallback)
     Universe      picks a renderer, owns resize / context-loss handling
     SoundEngine   original Web Audio synthesis (no audio files)
     UI            DOM references, event panel, timeline
     App           the director: cue sequencer + per-frame update + lifecycle

   ========================================================================== */

  'use strict';

  /* ------------------------------------------------------------------------
     0. Utilities & environment
     ---------------------------------------------------------------------- */

  const ENV = { reduced: mqReduce.matches, mobile: mqMobile.matches, compactLandscape: mqCompactLandscape.matches };

  const Listeners = {
    list: [],
    on(target, type, fn, opts) {
      target.addEventListener(type, fn, opts);

    },
    offAll() {

    ids: new Set(),
    after(ms, fn) {
