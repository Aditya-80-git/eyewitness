        this._layer(field.glow, { maxSize: 420, alpha: 0.06, soft: 1.3 }),
      ];

      this._lost = (e) => { e.preventDefault(); this.onLost(); };
      this.canvas.addEventListener('webglcontextlost', this._lost, false);
    }

    _layer(data, o) {
      const THREE = this.THREE;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(data.pos, 3));
      geo.setAttribute('aSeed', new THREE.BufferAttribute(data.seed, 1));
      geo.setAttribute('aSize', new THREE.BufferAttribute(data.size, 1));
      const mat = new THREE.ShaderMaterial({
        uniforms: Object.assign({}, this.shared, {
          uMaxSize: { value: o.maxSize }, uAlpha: { value: o.alpha }, uSoft: { value: o.soft },
        }),
        vertexShader: VERT,
        fragmentShader: FRAG,
        transparent: true,
        depthWrite: false,
        depthTest: false,
        blending: THREE.AdditiveBlending,
      });
      const points = new THREE.Points(geo, mat);
      points.frustumCulled = false;          // positions are scaled in the shader
      this.group.add(points);
      return { geo, mat, points };
    }

    resize(w, h, dpr) {
      this.renderer.setPixelRatio(dpr);
      this.renderer.setSize(w, h, false);
      this.camera.aspect = w / h;
      this.camera.updateProjectionMatrix();
      this.shared.uPixelRatio.value = dpr;
    }

    render(s) {
      const u = this.shared;
      u.uScale.value = s.scale;
      u.uTime.value = s.time;
      u.uSwirl.value = s.swirl;
      u.uBright.value = s.bright;
      u.uHeatAmt.value = s.heat;
      u.uColor.value.set(s.color[0], s.color[1], s.color[2]);
      this.group.rotation.y = s.rotY;
      this.camera.position.set(s.camX, s.camY, s.camZ);
      this.camera.lookAt(0, 0, 0);
      this.renderer.render(this.scene, this.camera);
    }

    dispose() {
      this.canvas.removeEventListener('webglcontextlost', this._lost, false);
      for (const l of this.layers) { l.geo.dispose(); l.mat.dispose(); this.group.remove(l.points); }
      this.layers.length = 0;
      this.renderer.dispose();
      if (this.renderer.forceContextLoss) this.renderer.forceContextLoss();
      this.canvas.remove();
    }
  }

  /* ------------------------------------------------------------------------
     3b. Canvas 2D fallback (same simulation, projected on the CPU)
     ---------------------------------------------------------------------- */
  class Canvas2DRenderer {
    constructor(host, field) {
      this.host = host;
      this.field = field;
      this.canvas = document.createElement('canvas');
      host.appendChild(this.canvas);
      this.ctx = this.canvas.getContext('2d');
      this.w = 1; this.h = 1; this.dpr = 1;
      this.sprite = null;
      this.spriteKey = '';
    }

    resize(w, h, dpr) {
      this.w = w; this.h = h; this.dpr = dpr;
      this.canvas.width = Math.round(w * dpr);
      this.canvas.height = Math.round(h * dpr);
    }

    _spriteFor(color) {
      const key = color.map((c) => Math.round(c * 24)).join(',');
      if (key === this.spriteKey && this.sprite) return this.sprite;
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d');
      const rgb = color.map((v) => Math.round(clamp(v, 0, 1) * 255));
      const hot = rgb.map((v) => Math.round(lerp(v, 255, 0.6)));
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, `rgba(${hot[0]},${hot[1]},${hot[2]},1)`);
      grad.addColorStop(0.25, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.55)`);
      grad.addColorStop(1, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 64);
      this.sprite = c;
      this.spriteKey = key;
      return c;
    }

    _draw(data, s, o, f, cx, cy, cosR, sinR) {
      const ctx = this.ctx;
      const pos = data.pos;
      const sprite = this.sprite;
      const swirling = s.swirl > 0.01;
      const k = 100 * s.scale;
      const sizeBase = 0.55 + 0.9 * Math.sqrt(s.scale);
      for (let i = 0; i < data.count; i++) {
        let x = pos[i * 3], y = pos[i * 3 + 1], z = pos[i * 3 + 2];
        if (swirling) {
          const a = s.swirl * (1 - data.rad[i]);
          const c = Math.cos(a), sn = Math.sin(a);
          const nx = x * c - z * sn;
          z = x * sn + z * c;
          x = nx;
        }
        const seed = data.seed[i];
        x += 0.012 * Math.sin(s.time * 0.2 + seed * 30);
        y += 0.012 * Math.cos(s.time * 0.17 + seed * 21);
        z += 0.012 * Math.sin(s.time * 0.13 + seed * 17);
        // cloud rotation around Y, then camera translation
        const wx = (x * cosR + z * sinR) * k - s.camX;
        const wy = y * k - s.camY;
        const wz = (-x * sinR + z * cosR) * k - s.camZ;
        const dist = -wz;
        if (dist < 1) continue;
        const t = clamp((dist - 1) / 7, 0, 1);
        const fade = t * t * (3 - 2 * t);
        const size = clamp(data.size[i] * sizeBase * (260 / dist), 1, o.maxSize);
        const sx = cx + (wx / dist) * f;
        const sy = cy - (wy / dist) * f;
        if (sx < -size || sx > this.w + size || sy < -size || sy > this.h + size) continue;
        const tw = 0.78 + 0.22 * Math.sin(s.time * (0.6 + seed * 2.4) + seed * 50);
        const alpha = s.bright * fade * tw * o.alpha;
        if (alpha < 0.01) continue;
        ctx.globalAlpha = alpha > 1 ? 1 : alpha;
        ctx.drawImage(sprite, sx - size / 2, sy - size / 2, size, size);
      }
    }

    render(s) {
      const ctx = this.ctx;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      if (s.bright < 0.005) return;
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.globalCompositeOperation = 'lighter';
      this._spriteFor(s.color);
      const f = (this.h / 2) / Math.tan((60 * Math.PI) / 360);
      const cx = this.w / 2, cy = this.h / 2;
      const cosR = Math.cos(s.rotY), sinR = Math.sin(s.rotY);
      this._draw(this.field.glow, s, { maxSize: 420, alpha: 0.06 }, f, cx, cy, cosR, sinR);
      this._draw(this.field.stars, s, { maxSize: 28, alpha: 0.9 }, f, cx, cy, cosR, sinR);
      ctx.globalAlpha = 1;
    }

    dispose() {
      this.sprite = null;
      this.canvas.remove();
    }
  }

  /* ------------------------------------------------------------------------
     3c. Universe: renderer selection, sizing, WebGL context loss
     ---------------------------------------------------------------------- */
  const Universe = {
    host: null,
    field: null,
    renderer: null,
    mode: 'none',

    init(host) {
      this.host = host;
      if (GLRenderer.supported()) {
        try { this._mountGL(); return; } catch (e) { this._unmount(); }
      }
      this._mountCanvas();
    },

    _counts(kind) {
      const c = CONFIG.particles[kind];
      return ENV.mobile ? [c.mobile, c.glowMobile] : [c.desktop, c.glowDesktop];
    },

    _mountGL() {
      const [stars, glow] = this._counts('gl');
      this.field = new ParticleField(stars, glow);
      this.renderer = new GLRenderer(this.host, this.field, () => this._onContextLost());
      this.mode = 'webgl';
      this.resize();
    },

    _mountCanvas() {
      const [stars, glow] = this._counts('canvas');
      this.field = new ParticleField(stars, glow);
      this.renderer = new Canvas2DRenderer(this.host, this.field);
      this.mode = 'canvas2d';
      this.resize();
    },

    _unmount() {
      if (this.renderer) { try { this.renderer.dispose(); } catch (e) { /* already gone */ } }
      this.renderer = null;
      this.field = null;
      this.mode = 'none';
    },

    _onContextLost() {
      this._unmount();
      this._mountCanvas();
    },

    resize() {
      if (!this.renderer || !this.host) return;
      const w = Math.max(1, this.host.clientWidth);
      const h = Math.max(1, this.host.clientHeight);
      const dpr = Math.min(window.devicePixelRatio || 1, ENV.mobile ? 1.25 : 1.5);
      this.renderer.resize(w, h, dpr);
    },

    render(state) { if (this.renderer) this.renderer.render(state); },

    dispose() { this._unmount(); },
  };

  /* ------------------------------------------------------------------------
     4. Sound: original ambience synthesized with the Web Audio API
     ---------------------------------------------------------------------- */
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.master = null;
      this.volume = 0.6;
      this.muted = false;
      this.layers = new Set();
      this.timeouts = new Set();
      this.amb = null;
      this.riserLayer = null;
      this.cosmic = null;
      this.moodIndex = 0;
    }

    /* One sound environment per chapter (root note, chord, timbre, filter, motion, texture). */
    static get MOODS() {
      return [
        /* 0 Big Bang / dawn          */ { root: 110.0, r: [1, 1.5, 2], t: ['sawtooth', 'sawtooth', 'sawtooth'], cut: 380, lfo: 0.045, ld: 150, air: 0.05, sh: 880, sg: 0.012, sp: 0 },
        /* 1 early particle universe  */ { root: 146.8, r: [1, 1.335, 2], t: ['sawtooth', 'square', 'sawtooth'], cut: 900, lfo: 0.3, ld: 400, air: 0.10, sh: 1760, sg: 0.02, sp: 7 },
        /* 2 first elements           */ { root: 98.0, r: [1, 1.5, 2.02], t: ['sawtooth', 'triangle', 'sawtooth'], cut: 560, lfo: 0.08, ld: 220, air: 0.06, sh: 784, sg: 0.012, sp: 2 },
        /* 3 formation of atoms       */ { root: 82.41, r: [1, 1.5, 2.25], t: ['triangle', 'sine', 'triangle'], cut: 300, lfo: 0.05, ld: 100, air: 0.03, sh: 1318.5, sg: 0.03, sp: 0.6 },
        /* 4 cosmic dark ages         */ { root: 55.0, r: [1, 1.5, 2], t: ['sine', 'sine', 'triangle'], cut: 180, lfo: 0.03, ld: 60, air: 0.02, sh: 660, sg: 0.004, sp: 0 },
        /* 5 first stars              */ { root: 130.8, r: [1, 1.5, 2], t: ['sawtooth', 'triangle', 'sawtooth'], cut: 700, lfo: 0.07, ld: 260, air: 0.04, sh: 1046.5, sg: 0.02, sp: 1.2 },
        /* 6 galaxies                 */ { root: 98.0, r: [1, 1.25, 1.5], t: ['triangle', 'triangle', 'sine'], cut: 520, lfo: 0.06, ld: 180, air: 0.04, sh: 1174.7, sg: 0.015, sp: 0.8 },
        /* 7 Milky Way                */ { root: 87.3, r: [1, 1.2, 1.5], t: ['sawtooth', 'triangle', 'triangle'], cut: 440, lfo: 0.04, ld: 200, air: 0.05, sh: 698.5, sg: 0.02, sp: 0.5 },
        /* 8 birth of the Sun/planets */ { root: 73.4, r: [1, 1.5, 1.89], t: ['sawtooth', 'sawtooth', 'triangle'], cut: 620, lfo: 0.1, ld: 300, air: 0.09, sh: 587.3, sg: 0.012, sp: 0 },
        /* 9 solar system             */ { root: 110.0, r: [1, 1.5, 1.875], t: ['triangle', 'sine', 'triangle'], cut: 420, lfo: 0.035, ld: 120, air: 0.03, sh: 880, sg: 0.02, sp: 0.4 },
      ];
    }

    /* Must be called from inside a user gesture (the ENTER click). */
    init() {
      if (this.ctx) { this.resume(); return true; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      try { this.ctx = new AC(); } catch (e) { return false; }
      const ctx = this.ctx;

      this.master = ctx.createGain();
      this.master.gain.value = 0;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.ratio.value = 6;
      comp.attack.value = 0.01;
      comp.release.value = 0.3;
      this.master.connect(comp);
      comp.connect(ctx.destination);

      this.reverb = ctx.createConvolver();
      this.reverb.buffer = this._impulse(3.2, 2.4);
      const wet = ctx.createGain();
      wet.gain.value = 0.5;
      this.reverb.connect(wet);
      wet.connect(this.master);

      this.noiseBuf = this._noiseBuffer(4);
      this._applyGain(0.4);
      return true;
    }

    get ok() { return !!this.ctx; }

    /* ---- master controls ---- */
    _target() { return this.muted ? 0 : Math.pow(this.volume, 1.6) * 0.9; }
    _applyGain(tc) {
      if (!this.master) return;
      this.master.gain.setTargetAtTime(this._target(), this.ctx.currentTime, tc || 0.06);
    }
    setVolume(v) { this.volume = clamp(v, 0, 1); this._applyGain(0.05); }
    setMuted(m) { this.muted = !!m; this._applyGain(0.05); }
    suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(noop); }
    resume() { if (this.ctx && this.ctx.state !== 'running' && this.ctx.state !== 'closed') this.ctx.resume().catch(noop); }

    /* ---- building blocks ---- */
    _impulse(seconds, decay) {
      const ctx = this.ctx;
      const len = Math.floor(ctx.sampleRate * seconds);
      const buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
      return buf;
    }
    _noiseBuffer(seconds) {
      const ctx = this.ctx;
      const len = Math.floor(ctx.sampleRate * seconds);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    }
    _layer(startGain, reverbSend) {
      const ctx = this.ctx;
      const out = ctx.createGain();
      out.gain.value = startGain;
      out.connect(this.master);
      const send = ctx.createGain();
      send.gain.value = reverbSend || 0;
      out.connect(send);
      send.connect(this.reverb);
      const layer = { out, send, srcs: [] };
      this.layers.add(layer);
      return layer;
    }
    _osc(layer, type, freq, dest, gain, detune) {
      const ctx = this.ctx;
      const o = ctx.createOscillator();
      o.type = type;
      o.frequency.value = freq;
      if (detune) o.detune.value = detune;
      const g = ctx.createGain();
      g.gain.value = gain;
      o.connect(g);
      g.connect(dest);
      o.start();
      layer.srcs.push(o);
      return { o, g };
    }
    _noise(layer, dest) {
      const s = this.ctx.createBufferSource();
      s.buffer = this.noiseBuf;
      s.loop = true;
      s.connect(dest);
      s.start();
      layer.srcs.push(s);
      return s;
    }
    _lfo(layer, hz, depth, param) {
      const ctx = this.ctx;
      const o = ctx.createOscillator();
      o.frequency.value = hz;
      const g = ctx.createGain();
      g.gain.value = depth;
      o.connect(g);
      g.connect(param);
      o.start();
      layer.srcs.push(o);
      o._g = g;
      return o;
    }
    _filter(type, freq, q, dest) {
      const f = this.ctx.createBiquadFilter();
      f.type = type;
      f.frequency.value = freq;
      f.Q.value = q;
      if (dest) f.connect(dest);
      return f;
    }
    _later(ms, fn, track) {
      if (track === false) { setTimeout(fn, ms); return; }
      const id = setTimeout(() => { this.timeouts.delete(id); fn(); }, ms);
      this.timeouts.add(id);
    }
    _stopLayer(layer, fade) {
      if (!this.ctx || !this.layers.has(layer)) return;
      const now = this.ctx.currentTime;
      try {
        layer.out.gain.cancelScheduledValues(now);
        layer.out.gain.setValueAtTime(layer.out.gain.value, now);
        layer.out.gain.linearRampToValueAtTime(0, now + fade);
      } catch (e) { /* ignore */ }
      for (const s of layer.srcs) { try { s.stop(now + fade + 0.05); } catch (e) { /* already stopped */ } }
      this.layers.delete(layer);
      this._later((fade + 0.4) * 1000, () => {
        try { layer.out.disconnect(); layer.send.disconnect(); } catch (e) { /* closed */ }
      }, false);
    }

    /* ---- the score ---- */

    /* Opening: a slow, mysterious drone with a beating low pair. */
    startAmbience() {
      if (!this.ctx) return;
      const L = this._layer(0, 0.35);
      this.amb = L;
      this._osc(L, 'sine', 55, L.out, 0.34);
      this._osc(L, 'sine', 55.6, L.out, 0.30);
      const warm = this._filter('lowpass', 520, 0.7, L.out);
      this._osc(L, 'triangle', 110, warm, 0.10);
      this._osc(L, 'triangle', 164.8, warm, 0.05, 7);
      const air = this._filter('bandpass', 700, 0.9);
      const airGain = this.ctx.createGain();
      airGain.gain.value = 0.05;
      this._noise(L, air);
      air.connect(airGain);
      airGain.connect(L.out);
      this._lfo(L, 0.06, 380, air.frequency);
      const now = this.ctx.currentTime;
      L.out.gain.setValueAtTime(0.0001, now);
      L.out.gain.linearRampToValueAtTime(0.9, now + 4);
    }

    /* The held breath before the bang: a rising tone + filtered noise. */
    riser(seconds) {
      if (!this.ctx) return;
      const ctx = this.ctx;
      const now = ctx.currentTime;
      const L = this._layer(0.0001, 0.3);
      this.riserLayer = L;
      const lp = this._filter('lowpass', 150, 3, L.out);
      const saw = this._osc(L, 'sawtooth', 38, lp, 0.6);
      saw.o.frequency.setValueAtTime(38, now);
      saw.o.frequency.exponentialRampToValueAtTime(190, now + seconds);
      lp.frequency.setValueAtTime(150, now);
      lp.frequency.exponentialRampToValueAtTime(1800, now + seconds);
      const bp = this._filter('bandpass', 300, 1.2);
      const ng = ctx.createGain();
      ng.gain.value = 0.2;
      this._noise(L, bp);
      bp.connect(ng);
      ng.connect(L.out);
      bp.frequency.setValueAtTime(300, now);
      bp.frequency.exponentialRampToValueAtTime(3200, now + seconds);
      L.out.gain.setValueAtTime(0.0001, now);
      L.out.gain.exponentialRampToValueAtTime(0.9, now + seconds);
    }

    /* The Big Bang: sub drop, thump, noise burst, then the cosmic bed. */
    impact() {
      if (!this.ctx) return;
      const ctx = this.ctx;
      const now = ctx.currentTime;
      if (this.riserLayer) { this._stopLayer(this.riserLayer, 0.12); this.riserLayer = null; }
      if (this.amb) {
        this.amb.out.gain.cancelScheduledValues(now);
        this.amb.out.gain.setTargetAtTime(0, now, 0.08);
      }
      const L = this._layer(1, 0.55);

      const sub = this._osc(L, 'sine', 92, L.out, 0.0001);
      sub.o.frequency.setValueAtTime(92, now);
      sub.o.frequency.exponentialRampToValueAtTime(26, now + 2.8);
      sub.g.gain.setValueAtTime(0.0001, now);
      sub.g.gain.linearRampToValueAtTime(1.0, now + 0.012);
      sub.g.gain.exponentialRampToValueAtTime(0.001, now + 3.4);

      const th = this._osc(L, 'triangle', 150, L.out, 0.0001);
      th.o.frequency.setValueAtTime(150, now);
      th.o.frequency.exponentialRampToValueAtTime(38, now + 0.5);
      th.g.gain.setValueAtTime(0.0001, now);
      th.g.gain.linearRampToValueAtTime(0.8, now + 0.01);
      th.g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

      const lp = this._filter('lowpass', 9000, 0.7);
      lp.frequency.setValueAtTime(9000, now);
      lp.frequency.exponentialRampToValueAtTime(160, now + 3.2);
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.0001, now);
      ng.gain.linearRampToValueAtTime(0.9, now + 0.01);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 3.6);
      this._noise(L, lp);
      lp.connect(ng);
      ng.connect(L.out);

      const hp = this._filter('highpass', 3500, 0.7);
      const hg = ctx.createGain();
      hg.gain.setValueAtTime(0.0001, now);
      hg.gain.linearRampToValueAtTime(0.25, now + 0.02);
      hg.gain.exponentialRampToValueAtTime(0.001, now + 1.6);
      this._noise(L, hp);
      hp.connect(hg);
      hg.connect(L.out);

      this._later(4600, () => this._stopLayer(L, 0.2));
      this._later(900, () => this.startCosmic());
    }

    /* Atmospheric bed that follows the story (see MOODS). */
    startCosmic() {
      if (!this.ctx || this.cosmic) return;
      const ctx = this.ctx;
      const L = this._layer(0, 0.5);
      this.cosmic = L;
      const lp = this._filter('lowpass', 380, 0.7, L.out);
      this.cosmicLfo = this._lfo(L, 0.045, 150, lp.frequency);
      this.cosmicOscs = [
        this._osc(L, 'sawtooth', 110, lp, 0.10, -6),
        this._osc(L, 'sawtooth', 165, lp, 0.07, 5),
        this._osc(L, 'sawtooth', 220, lp, 0.05, -3),
      ];
      this.cosmicSub = this._osc(L, 'sine', 55, L.out, 0.28);
      const airLp = this._filter('lowpass', 900, 0.7);
      const airG = ctx.createGain();
      airG.gain.value = 0.05;
      this._noise(L, airLp);
      airLp.connect(airG);
      airG.connect(L.out);
      this.cosmicAirG = airG;
      this.shimmer = this._osc(L, 'sine', 880, L.out, 0.012);
      this._lfo(L, 0.17, 0.007, this.shimmer.g.gain);
      this.cosmicLP = lp;

      const now = ctx.currentTime;
      L.out.gain.setValueAtTime(0.0001, now);
      L.out.gain.linearRampToValueAtTime(0.8, now + 7);
      if (this.amb) { this._stopLayer(this.amb, 0.5); this.amb = null; }
      this.setMood(this.moodIndex, true);
    }

    setMood(i, instant) {
      this.moodIndex = i;
      if (!this.ctx || !this.cosmic) return;
      const M = SoundEngine.MOODS;
      const m = M[clamp(i, 0, M.length - 1)];
      const t = this.ctx.currentTime;
      const tc = instant ? 0.01 : 1.6;
      m.r.forEach((ratio, k) => {
        const o = this.cosmicOscs[k].o;
        if (o.type !== m.t[k]) o.type = m.t[k];
        o.frequency.setTargetAtTime(m.root * ratio, t, tc);
      });
      this.cosmicSub.o.frequency.setTargetAtTime(m.root / 2, t, tc);
      this.cosmicLP.frequency.setTargetAtTime(m.cut, t, tc);
      this.cosmicLfo.frequency.setTargetAtTime(m.lfo, t, tc);
      this.cosmicLfo._g.gain.setTargetAtTime(m.ld, t, tc);
      this.cosmicAirG.gain.setTargetAtTime(m.air, t, tc);
      this.shimmer.o.frequency.setTargetAtTime(m.sh, t, tc);
      this.shimmer.g.gain.setTargetAtTime(m.sg, t, tc);
      this.mood = m;
    }

    /* Per-frame texture: crackles in the particle era, soft bell tones elsewhere. */
    tick(dt) {
      const m = this.mood;
      if (!this.ctx || !this.cosmic || !m || !m.sp || this.muted) return;
      this.sparkAcc = (this.sparkAcc || 0) - dt;
      if (this.sparkAcc > 0) return;
      this.sparkAcc = (0.5 + Math.random()) / m.sp;
      const ctx = this.ctx;
      const now = ctx.currentTime;
      const crackle = m.sp > 5;
      const o = ctx.createOscillator();
      o.type = crackle ? 'square' : 'sine';
      o.frequency.value = m.root * [4, 5, 6, 8, 9, 12][(Math.random() * 6) | 0] * (crackle ? 2 : 1);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(crackle ? 0.02 : 0.045, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + (crackle ? 0.07 : 0.9));
      o.connect(g);
      g.connect(this.cosmic.out);
      o.start(now);
      o.stop(now + 1);
      o.onended = () => { try { o.disconnect(); g.disconnect(); } catch (e) { /* closed */ } };
    }

    /* One-shot effects called by scenes: 'ignite' (star ignition) and 'boom' (supernova). */
    fx(name) {
      if (!this.ctx) return;
      const ctx = this.ctx;
      const now = ctx.currentTime;
      const L = this._layer(1, 0.55);
      if (name === 'ignite') {
        const o = this._osc(L, 'sine', 180, L.out, 0.0001);
        o.o.frequency.setValueAtTime(180, now);
        o.o.frequency.exponentialRampToValueAtTime(1400, now + 1.6);
        o.g.gain.setValueAtTime(0.0001, now);
        o.g.gain.linearRampToValueAtTime(0.22, now + 0.8);
        o.g.gain.exponentialRampToValueAtTime(0.001, now + 2.4);
        const bp = this._filter('bandpass', 400, 1);
        bp.frequency.setValueAtTime(400, now);
        bp.frequency.exponentialRampToValueAtTime(4200, now + 1.4);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(0.18, now + 1);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
        this._noise(L, bp);
        bp.connect(g);
        g.connect(L.out);
        const th = this._osc(L, 'sine', 70, L.out, 0.0001);
        th.g.gain.setValueAtTime(0.0001, now + 1.2);
        th.g.gain.linearRampToValueAtTime(0.4, now + 1.25);
        th.g.gain.exponentialRampToValueAtTime(0.001, now + 2.6);
        this._later(3200, () => this._stopLayer(L, 0.1));
      } else if (name === 'boom') {
        const sub = this._osc(L, 'sine', 80, L.out, 0.0001);
        sub.o.frequency.setValueAtTime(80, now);
        sub.o.frequency.exponentialRampToValueAtTime(24, now + 2.6);
        sub.g.gain.setValueAtTime(0.0001, now);
        sub.g.gain.linearRampToValueAtTime(0.85, now + 0.015);
        sub.g.gain.exponentialRampToValueAtTime(0.001, now + 3.2);
        const lp = this._filter('lowpass', 7000, 0.7);
        lp.frequency.setValueAtTime(7000, now);
        lp.frequency.exponentialRampToValueAtTime(140, now + 3);
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(0.0001, now);
        ng.gain.linearRampToValueAtTime(0.7, now + 0.015);
        ng.gain.exponentialRampToValueAtTime(0.001, now + 3.4);
        this._noise(L, lp);
        lp.connect(ng);
        ng.connect(L.out);
        this._later(4200, () => this._stopLayer(L, 0.2));
      }
    }

    /* A soft rising whoosh marking a change of era. */
    swell() {
      if (!this.ctx) return;
      const ctx = this.ctx;
      const now = ctx.currentTime;
      const L = this._layer(1, 0.6);
      const bp = this._filter('bandpass', 180, 0.9);
      bp.frequency.setValueAtTime(180, now);
      bp.frequency.exponentialRampToValueAtTime(1400, now + 2.6);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(0.2, now + 1.2);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 3);
      this._noise(L, bp);
      bp.connect(g);
      g.connect(L.out);
      this._later(3400, () => this._stopLayer(L, 0.1));
    }

    stopAll(fade) {
      this.timeouts.forEach(clearTimeout);
      this.timeouts.clear();
      for (const l of Array.from(this.layers)) this._stopLayer(l, fade);
      this.amb = this.riserLayer = this.cosmic = null;
      this.moodIndex = 0;
      this.mood = null;
      this.sparkAcc = 0;
    }

    dispose() {
      if (!this.ctx) return;
      this.stopAll(0.05);
      try { this.ctx.close(); } catch (e) { /* ignore */ }
      this.ctx = null;
      this.master = null;
      this.noiseBuf = null;
    }
  }

  const Sound = new SoundEngine();

  /* ------------------------------------------------------------------------
     5. UI: DOM references, chapter panel, readout
     (the timeline, dock and science drawer live in ui.js)
     ---------------------------------------------------------------------- */
  const UI = {
    init() {
      const q = byId;
      this.app = q('app');
      this.stage = q('stage');
      this.host = q('canvas-host');
      this.sceneCanvas = q('scene-canvas');
      this.core = q('core');
      this.flash = q('flash');
      this.welcome = q('welcome');
      this.enterBtn = q('enter-btn');
      this.panel = q('event-panel');
      this.epWhen = q('ep-when');
      this.epTitle = q('ep-title');
      this.infoToggle = q('ep-collapse');
      this.infoDetails = q('ep-details');
      this.epText = q('ep-text');
      this.epNote = q('ep-note');
      this.epVisual = q('ep-visual');
      this.btnPrev = q('btn-prev');
      this.btnNext = q('btn-next');
      this.replayBtn = q('replay-btn');
      this.age = q('tl-age');
      this.ago = q('tl-ago');
      this.journey = q('tl-journey');
      this.caption = q('scene-caption');
      this.controls = q('controls');
      this.speedControl = q('project-speed-slider');
      this.speedReadout = q('project-speed-value');
      this.muteBtn = q('mute-btn');
      this.volume = q('volume');
      this.hazes = Array.from(this.stage.querySelectorAll('.haze'));
      this.panelShown = false;
      this.swapTimer = 0;
      this.capText = '';
    },

    cls(name, on) { this.app.classList.toggle(name, on !== false); },
    phase(name) { this.app.dataset.phase = name; },
    setHaze(index) { this.hazes.forEach((h, i) => h.classList.toggle('is-on', i === index)); },

    setInfoCollapsed(collapsed) {
      const isCollapsed = !!collapsed;
      this.panel.classList.toggle('is-collapsed', isCollapsed);
      this.infoToggle.setAttribute('aria-expanded', String(!isCollapsed));
      this.infoToggle.setAttribute('aria-label', isCollapsed ? 'Show chapter information' : 'Hide chapter information');
      this.infoToggle.title = isCollapsed ? 'Show chapter information' : 'Hide chapter information';
      this.infoDetails.setAttribute('aria-hidden', String(isCollapsed));
    },

    setCaption(text) {
      if (text === this.capText) return;
      this.capText = text;
      this.caption.textContent = text;
      this.caption.classList.toggle('is-on', !!text);
    },

    setReadout(ch, i, n) {
      this.age.textContent = ch.age;
      this.ago.textContent = ch.ago;
      this.journey.textContent = 'Chapter ' + (i + 1) + ' of ' + n + ' · ' + Math.round((i / (n - 1)) * 100) + '% of the journey';
      this.btnPrev.disabled = i <= 0;
      this.btnNext.disabled = i >= n - 1;
    },

    renderPanel(ch) {
      const apply = () => {
        this.epWhen.textContent = ch.when;
        this.epTitle.textContent = ch.title;
        this.epText.textContent = ch.text;
        this.epNote.textContent = ch.note;
        this.epVisual.textContent = ch.visual;
        this.epVisual.className = 'vis-tag ' + (ch.visual === EW.LABELS.REAL ? 'real' : 'art');
      };
      this.panel.classList.toggle('is-compact', !!ch.compact);
      this.panel.classList.add('is-glass-panel');
      Timers.clear(this.swapTimer);
      if (!this.panelShown) {
        apply();
        this.panelShown = true;
        this.panel.classList.remove('is-swapping');
        this.panel.classList.add('is-in');
        return;
      }
      this.panel.classList.add('is-swapping');
      this.swapTimer = Timers.after(320, () => {
        apply();
        this.panel.classList.remove('is-swapping');
        this.panel.classList.add('is-in');
      });
    },

    syncMute() {
      const m = Sound.muted;
      this.muteBtn.classList.toggle('is-muted', m);
      this.muteBtn.setAttribute('aria-pressed', String(m));
      this.muteBtn.setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound');
    },

    /* Fade the whole scene out (used by Replay). */
    fadeOutScene() {
      ['show-stage', 'show-hud', 'show-era', 'show-sub', 'hide-intro'].forEach((c) => this.cls(c, false));
      this.panel.classList.remove('is-in');
      this.replayBtn.hidden = true;
      this.setHaze(-1);
      this.setCaption('');
    },

    /* Return every DOM state to "before the bang" (used by Replay). */
    resetDom() {
      Timers.clear(this.swapTimer);
      this.panelShown = false;
      this.panel.classList.remove('is-in', 'is-swapping');
      this.setInfoCollapsed(false);
      this.replayBtn.hidden = true;
      this.age.textContent = '—';
      this.ago.textContent = '';
      this.journey.textContent = '';
      this.setHaze(-1);
      this.flash.style.opacity = '0';
      this.stage.style.transform = '';
      this.host.style.opacity = '1';
      this.core.style.opacity = '0';
      this.core.style.transform = 'scale(1)';
      this.phase('entering');
    },
  };

  /* ------------------------------------------------------------------------
     6. App: director (cue sequencer + per-frame update) and lifecycle
     ---------------------------------------------------------------------- */
  const INITIAL_STATE = () => ({
    time: 0, scale: 0.0005, swirl: 0, bright: 0, color: [1.0, 0.93, 0.8], heat: 1,
    rotY: 0, camX: 0, camY: 0, camZ: 95,
  });
  const S = INITIAL_STATE();   // the single render-state object the particle renderers read
  const cloneTint = (t) => Object.assign({}, t, { color: t.color.slice() });

  const App = {
    started: false,
    disposed: false,
    paused: false,
    replaying: false,
    clock: 0,
    last: 0,
    raf: 0,
    speed: 1,
    cues: [],
    cueIndex: 0,
    bangAt: CONFIG.BANG_AT,
    reached: -1,         // furthest chapter visited; retained for progress styling
    view: -1,            // chapter currently shown
    coreTarget: 0,
    coreOp: 0,
    wash: 0,
    brightTarget: 1,
    tint: null,
    flashShown: 0,
    shaking: false,
    uniTarget: 1,
    uniAlpha: 1,

    /* ---- startup ---- */
    boot() {
      UI.init();
      EW.timeline.build(EVENTS, (i) => this.goChapter(i, true));
      EW.timeline.set(-1, -1);
      EW.ui.init(this);
      Universe.init(UI.host);
      Scenes.init(UI.sceneCanvas, {
        caption: (t) => UI.setCaption(t),
        fx: (n) => Sound.fx(n),
        solarSelect: (id) => EW.ui.solarSelect(id),
      }, { mobile: () => ENV.mobile, reduced: () => ENV.reduced, compactLandscape: () => ENV.compactLandscape });
      this.resizeAll();
      this.tint = cloneTint(EVENTS[0].tint);
      const sp = Number(new URLSearchParams(window.location.search).get('speed'));
      this.setSpeed(sp > 0 ? sp : 1);

      // Safety net for browsers without `overflow: clip`: the scene must never scroll.
      Listeners.on(UI.app, 'scroll', () => { UI.app.scrollTop = 0; UI.app.scrollLeft = 0; });
      Listeners.on(UI.enterBtn, 'click', () => this.enter(), { once: true });
      Listeners.on(UI.replayBtn, 'click', () => this.replay());
      Listeners.on(UI.btnNext, 'click', () => this.next());
      Listeners.on(UI.btnPrev, 'click', () => this.prev());
      Listeners.on(UI.muteBtn, 'click', () => { Sound.setMuted(!Sound.muted); UI.syncMute(); });
      Listeners.on(UI.speedControl, 'input', () => this.setSpeed(UI.speedControl.value));
      Listeners.on(UI.infoToggle, 'click', () => UI.setInfoCollapsed(!UI.panel.classList.contains('is-collapsed')));
      Listeners.on(byId('chapter-frame'), 'load', () => this.syncFrameSpeed());
      Listeners.on(UI.volume, 'input', () => {
        Sound.setVolume(Number(UI.volume.value) / 100);
        if (Sound.muted && Number(UI.volume.value) > 0) { Sound.setMuted(false); UI.syncMute(); }
      });
      Listeners.on(document, 'keydown', (e) => {
        if (!this.started || e.metaKey || e.ctrlKey || e.altKey) return;
        const tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if (e.key === 'm' || e.key === 'M') { Sound.setMuted(!Sound.muted); UI.syncMute(); }
        else if (e.key === 'ArrowRight') this.next();
        else if (e.key === 'ArrowLeft') this.prev();
      });

      let resizeQueued = false;
      const syncViewportMode = () => {
        const wasMobile = ENV.mobile;
        ENV.mobile = mqMobile.matches;
        ENV.compactLandscape = mqCompactLandscape.matches;
        if (ENV.mobile && !wasMobile && this.view >= 0) { UI.setInfoCollapsed(true); EW.ui.toggleDock(false); }
      };
      const onResize = () => {
        syncViewportMode();
        if (resizeQueued) return;
        resizeQueued = true;
        requestAnimationFrame(() => { resizeQueued = false; if (!this.disposed) this.resizeAll(); });
      };
      Listeners.on(window, 'resize', onResize);
      Listeners.on(window, 'orientationchange', onResize);

      const onReduce = () => { ENV.reduced = mqReduce.matches; };
      const onMobile = () => { syncViewportMode(); };
      if (mqReduce.addEventListener) {
        Listeners.on(mqReduce, 'change', onReduce);
        Listeners.on(mqMobile, 'change', onMobile);
        Listeners.on(mqCompactLandscape, 'change', onMobile);
      }

      Listeners.on(document, 'visibilitychange', () => (document.hidden ? this.pause() : this.resume()));
      Listeners.on(window, 'pagehide', (e) => { if (e.persisted) this.pause(); else this.dispose(); });
      Listeners.on(window, 'pageshow', (e) => { if (e.persisted) this.resume(); });

      UI.syncMute();
    },

    resizeAll() {
      Universe.resize();
      const w = Math.max(1, UI.host.clientWidth);
      const h = Math.max(1, UI.host.clientHeight);
      Scenes.resize(w, h, Math.min(window.devicePixelRatio || 1, ENV.mobile ? 1.25 : 1.5), false);
      EW.timeline.layout();
    },

    /* ---- ENTER ---- */
    enter() {
      if (this.started) return;
      this.started = true;
      const audioOk = Sound.init();          // inside the click => allowed to start
      if (!audioOk) UI.controls.hidden = true;
      Sound.startAmbience();
      UI.syncMute();
      this.cues = this.buildCues();
      this.cueIndex = 0;
      this.clock = 0;
      this.start();
    },

    /* The opening cinematic is time-driven; from the first chapter on, the user drives. */
    buildCues() {
      const B = this.bangAt;
      const T = CONFIG.TENSION_AT;
      const cues = [];
      const at = (t, fn) => cues.push({ at: t, fn });

      at(0.0, () => { UI.welcome.classList.add('is-leaving'); UI.phase('entering'); });
      at(0.8, () => { UI.cls('show-stage', true); UI.cls('show-controls', true); });
      at(1.0, () => { this.coreTarget = 1; UI.phase('void'); });
      at(1.7, () => UI.cls('show-era', true));
      at(1.9, () => { UI.welcome.hidden = true; });
      at(3.1, () => UI.cls('show-sub', true));
      at(T, () => Sound.riser(B - T));
      at(B, () => {
        UI.phase('bang');
        UI.cls('hide-intro', true);
        UI.setHaze(0);
        Sound.impact();
      });
      at(B + 1.4, () => {
        this.goChapter(0, false);
        if (ENV.mobile) UI.setInfoCollapsed(true);
        UI.cls('show-hud', true);
        UI.phase('explore');
      });
      return cues.sort((a, b) => a.at - b.at);
    },

    /* ---- chapter navigation ---- */
    next() { if (this.view >= 0 && this.view < EVENTS.length - 1) this.goChapter(this.view + 1, false); },
    prev() { if (this.view > 0) this.goChapter(this.view - 1, true); },
    setSpeed(value) {
      const requested = Number(value);
      this.speed = clamp(Number.isFinite(requested) ? requested : 1, 0.25, 2);
      UI.speedControl.value = String(this.speed);
      const label = this.speed.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
      UI.speedReadout.value = label + '×';
      UI.speedReadout.textContent = UI.speedReadout.value;
      this.syncFrameSpeed();
    },
    syncFrameSpeed() {
      const frame = byId('chapter-frame');
      if (!frame.hidden && frame.contentWindow) frame.contentWindow.postMessage({ type: 'eyewitness-speed', speed: this.speed }, '*');
    },

    /* Show any chapter directly from the timeline, jump menu, or Back/Next. */
    goChapter(i, manual) {
      const ch = EVENTS[i];
      if (!ch) return;
      if (this.view === i) { EW.timeline.set(i, this.reached); return; }
      const changed = this.view !== i;
      this.reached = Math.max(this.reached, i);
      this.view = i;
      const chapterSpeed = ['dark-ages', 'first-stars', 'galaxies', 'galaxy-types', 'sun-birth', 'planets', 'solar-system'].includes(ch.id) ? 2 : 1;
      this.setSpeed(chapterSpeed);
      this.tint = cloneTint(ch.tint);
      this.brightTarget = ch.tint.bright;
      if (changed) this.wash = Math.max(this.wash, ch.tint.wash * (ENV.reduced ? 0.5 : 1));
      this.uniTarget = ch.universe ? 1 : 0;
      UI.setHaze(ch.tint.haze);
      Scenes.activate((ch.id === 'dark-ages' || ch.id === 'first-stars') ? 'none' : ch.scene);
      if (ch.scene === 'none') UI.setCaption('');
      EW.ui.setChapter(ch);
      UI.renderPanel(ch);
      UI.setReadout(ch, i, EVENTS.length);
      EW.timeline.set(i, this.reached);
      UI.replayBtn.hidden = i !== EVENTS.length - 1;
      Sound.setMood(ch.mood, false);
      if (changed && i > 0) Sound.swell();

      const chapterFrame = byId('chapter-frame');
      const sourceId = ch.id === 'dark-ages' ? 'dark-ages-source' : ch.id === 'first-stars' ? 'first-star-source' : ch.id === 'solar-system' ? 'solar-source' : ch.id === 'cosmic-timeline' ? 'summary-source' : ch.id === 'galaxies' ? 'galaxy-source' : ch.id === 'galaxy-types' ? 'galaxy-types-source' : null;
      if (sourceId) {
        if (chapterFrame.dataset.sourceId !== sourceId || chapterFrame.hidden) {
          chapterFrame.srcdoc = byId(sourceId).content.textContent;
          chapterFrame.dataset.sourceId = sourceId;
        }
        chapterFrame.hidden = false;
        Sound.suspend();
      } else if (!chapterFrame.hidden) {
        chapterFrame.removeAttribute('srcdoc');
        chapterFrame.src = 'about:blank';
        chapterFrame.hidden = true;
        delete chapterFrame.dataset.sourceId;
        Sound.resume();
      }
    },

    /* ---- frame loop ---- */
    start() {
      if (this.raf || this.disposed) return;
      this.last = 0;
      const loop = (now) => {
        this.raf = requestAnimationFrame(loop);
        if (!this.last) this.last = now;
        const dt = clamp((now - this.last) / 1000, 0, 0.1);
        this.last = now;
        this.update(dt * this.speed);
        const chapterFrame = byId('chapter-frame');
        if (chapterFrame.hidden) {
          if (this.uniAlpha > 0.01) Universe.render(S);
          if (Scenes.current) Scenes.render();
        }
      };
      this.raf = requestAnimationFrame(loop);
    },

    stop() {
      if (this.raf) cancelAnimationFrame(this.raf);
      this.raf = 0;
    },

    pause() {
      if (this.paused) return;
      this.paused = true;
      this.stop();
      Sound.suspend();
    },

    resume() {
      if (!this.paused || this.disposed) return;
      this.paused = false;
      if (this.started) { this.start(); Sound.resume(); }
    },

    update(dt) {
      this.clock += dt;
      const c = this.clock;
      while (this.cueIndex < this.cues.length && c >= this.cues[this.cueIndex].at) {
        this.cues[this.cueIndex++].fn();
      }

      const B = this.bangAt;
      const tb = c - B;
      const banged = tb >= 0;
      const motion = ENV.reduced ? 0 : 1;

      /* The tiny glowing point, then the intense core of the bang. */
      this.coreOp += (this.coreTarget - this.coreOp) * (1 - Math.exp(-dt * 1.2));
      let coreScale;
      let coreOpacity;
      if (!banged) {
        const t = clamp((c - CONFIG.TENSION_AT) / (B - CONFIG.TENSION_AT), 0, 1);
        coreScale = 1 + 0.9 * t * t + Math.sin(c * (2.2 + 9 * t)) * (0.06 + 0.3 * t) * motion;
        coreOpacity = this.coreOp;
      } else {
        coreScale = 1.9 + 70 * (1 - Math.exp(-tb * 2.4));
        coreOpacity = tb < 0.6 ? 1 : Math.exp(-(tb - 0.6) * 1.25);
      }
      UI.core.style.opacity = coreOpacity.toFixed(3);
      UI.core.style.transform = 'scale(' + coreScale.toFixed(3) + ')';

      /* Powerful but controlled flash (+ soft light wash when a chapter changes). */
      let flash = 0;
      if (banged) {
        if (!ENV.reduced) flash = tb < 0.09 ? 0.95 * (tb / 0.09) : 0.95 * Math.exp(-(tb - 0.09) * 1.9);
        else flash = 0.32 * Math.min(tb / 0.7, 1) * Math.exp(-Math.max(tb - 0.7, 0) * 1.3);
      }
      this.wash *= Math.exp(-dt * 0.8);
      flash = Math.max(flash, this.wash);
      if (flash < 0.001) flash = 0;
      if (flash !== this.flashShown) {
        this.flashShown = flash;
        UI.flash.style.opacity = flash.toFixed(3);
      }

      /* Brief cinematic screen shake. */
      if (banged && !ENV.reduced && tb < 1.8) {
        const A = (ENV.mobile ? 9 : 15) * Math.exp(-tb * 2.6);
        const dx = (Math.sin(tb * 71) + 0.5 * Math.sin(tb * 37 + 1.3)) * A;
        const dy = (Math.cos(tb * 63) + 0.5 * Math.sin(tb * 29 + 0.4)) * A;
        UI.stage.style.transform = 'translate3d(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px,0)';
        this.shaking = true;
      } else if (this.shaking) {
        UI.stage.style.transform = '';
        this.shaking = false;
      }

      /* Expansion of space: a fast early rise, then a long slow growth. */
      S.time = c;
      S.scale = banged ? 0.0005 + 0.62 * (1 - Math.exp(-tb * 2.4)) + 0.38 * easeOutCubic(tb / 45) : 0.0005;
      S.swirl = banged ? (2.6 * Math.exp(-tb * 0.35) + 0.1) * (ENV.reduced ? 0.3 : 1) : 0;
      S.bright = banged ? lerp(S.bright, this.brightTarget, 1 - Math.exp(-dt * (tb < 0.5 ? 10 : 0.8))) : 0;

      const k = 1 - Math.exp(-dt * 0.45);
      for (let i = 0; i < 3; i++) S.color[i] = lerp(S.color[i], this.tint.color[i], k);
      S.heat = lerp(S.heat, this.tint.heat, k);

      S.camZ = banged ? 95 - 50 * smooth(tb / 50) * motion : 95;
      S.camX = Math.sin(c * 0.11) * 3.5 * motion;
      S.camY = Math.cos(c * 0.09) * 2.2 * motion;
      S.rotY = c * 0.018 * motion;

      /* The particle universe fades away once the story leaves the early universe. */
      this.uniAlpha += (this.uniTarget - this.uniAlpha) * (1 - Math.exp(-dt * 1.4));
      UI.host.style.opacity = this.uniAlpha.toFixed(3);

      const chapterFrame = byId('chapter-frame');
      if (chapterFrame.hidden) Scenes.update(dt);
      Sound.tick(dt);
    },

    /* ---- replay ---- */
    replay() {
      if (this.replaying || !this.started) return;
      this.replaying = true;
      Timers.clearAll();
      Sound.stopAll(2.2);
      UI.fadeOutScene();
      Scenes.activate('none');
      EW.ui.reset();
      this.uniTarget = 1;
      Timers.after(2800, () => {
        if (this.disposed) return;
        this.clock = 0;
        this.cueIndex = 0;
        this.reached = -1;
        this.view = -1;
        this.coreTarget = 0;
        this.coreOp = 0;
        this.wash = 0;
        this.brightTarget = 1;
        this.flashShown = 0;
        this.uniAlpha = 1;
        this.uniTarget = 1;
        this.tint = cloneTint(EVENTS[0].tint);
        Object.assign(S, INITIAL_STATE());
        EW.timeline.set(-1, -1);
        UI.resetDom();
        Sound.startAmbience();
        this.cues = this.buildCues();
        this.replaying = false;
      });
    },

    /* ---- teardown ---- */
    dispose() {
      if (this.disposed) return;
      this.disposed = true;
      this.stop();
      Timers.clearAll();
      Listeners.offAll();
      EW.ui.dispose();
      Scenes.dispose();
      Sound.dispose();
      Universe.dispose();
    },
  };

  /* ------------------------------------------------------------------------
     7. Go
     ---------------------------------------------------------------------- */
  App.boot();

  // Handle for debugging in the console and for future stages.
  window.EYEWITNESS = { version: 'stage-2', CONFIG, EVENTS, App, Universe, Sound, UI, Scenes, state: S };
})();

  </script>
