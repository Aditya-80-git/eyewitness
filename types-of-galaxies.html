<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Types of galaxies in the universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c12;--ink:#fff;--btn:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{display:flex;flex-direction:column;font-family:Teko,"Arial Narrow",Impact,sans-serif}
header{padding:4px 10px 4px;text-align:center}
h1{margin:0;font-weight:600;font-size:clamp(22px,4.6vw,48px);line-height:1.05;letter-spacing:.14em;color:var(--ink)}
#row{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#cfd6e6;font-size:clamp(15px,2.2vw,20px);margin-top:2px}
#row span{text-align:left;line-height:1.1}
#btns{display:flex;gap:6px;flex:none}
#btns button{padding:4px 11px;border:1px solid rgba(255,255,255,.4);border-radius:20px;background:var(--btn);color:var(--ink);font:600 12px system-ui,sans-serif;cursor:pointer}
#btns button:focus-visible{outline:2px solid #8fb8ff;outline-offset:2px}
canvas{flex:1;min-height:0;width:100%;display:block}
@media (max-width: 640px) {
  html, body { height: 100dvh; }
  header { padding: 5px 8px 3px; }
  h1 { font-size: clamp(15px, 4vw, 22px); letter-spacing: .06em; line-height: 1.05; }
  #row { gap: 5px; font-size: 12px; }
  #row span { min-width: 0; }
  #btns { gap: 4px; }
  #btns button { padding: 4px 7px; font-size: 10px; white-space: nowrap; }
}
@media (max-height: 540px) and (orientation: landscape) {
  header { padding: 3px 8px 2px; }
  h1 { font-size: 16px; }
  #row { font-size: 11px; }
}
</style>
</head>
<body>
<header><h1>TYPES OF GALAXIES IN THE UNIVERSE</h1><div id="row"><span><b id="ph"></b><br><i id="ag" style="font-style:normal;opacity:.8"></i></span><div id="btns"><button id="replay" type="button">Replay</button><button id="skip" type="button">Skip to end</button></div></div></header>
<canvas id="c" aria-label="Conceptual comparison of galaxy shapes, sizes, activity, and interactions; not a timeline or photograph"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ph=document.getElementById('ph'),ag=document.getElementById('ag');
let W,H,DPR,speed=2,elapsed=0,lastFrame=performance.now(),CELLS=[];
const TAU=Math.PI*2,GAP=4,sm=x=>{x=x<0?0:x>1?1:x;return x*x*(3-2*x)};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=rng(8);
function gauss(){let u=0;while(!u)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*rnd())}
try{document.fonts.load('600 20px Teko')}catch(e){}
const NAMES=['SPIRAL GALAXIES','ELLIPTICAL GALAXIES','IRREGULAR GALAXIES','PECULIAR GALAXIES','LENTICULAR GALAXIES','DWARF GALAXIES','ACTIVE GALAXIES','SEYFERT GALAXIES','QUASARS','BLAZARS','INTERACTING GALAXIES','DARK GALAXY CANDIDATES'];
const PAL={blue:[[150,185,255],[255,255,255],[255,215,170],[255,130,190]],ice:[[170,215,235],[235,248,255],[150,190,225]],irr:[[205,195,180],[170,190,215],[255,215,165],[130,100,80]],ice2:[[190,215,245],[240,245,255],[255,235,210],[200,220,255]],dwarf:[[235,235,228],[255,242,205],[200,215,235]],act:[[210,100,55],[255,160,100],[160,75,45],[255,205,160]],sey:[[120,235,225],[255,255,255],[255,85,110],[255,70,175]],qso:[[255,165,105],[255,255,255],[185,200,255],[255,120,60]],blz:[[255,190,150],[255,255,255],[220,160,130],[255,215,180]],dk:[[150,85,255],[255,255,255],[195,125,255],[125,65,225]],warm:[[255,200,140],[255,230,190],[255,150,100],[200,170,255]]};
const SPC={};
function spr(c){const k=c.join();if(SPC[k])return SPC[k];const s=document.createElement('canvas');s.width=s.height=32;const g=s.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);
 r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.3,`rgba(${c[0]},${c[1]},${c[2]},.8)`);r.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);g.fillStyle=r;g.fillRect(0,0,32,32);return SPC[k]=s}
const DKS=(()=>{const s=document.createElement('canvas');s.width=s.height=32;const g=s.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,'rgba(0,0,6,.9)');r.addColorStop(1,'rgba(0,0,6,0)');g.fillStyle=r;g.fillRect(0,0,32,32);return s})();

// c = which cell; tau = tilt; phi = rotation; d = birth delay; sc = size in the cell
const GAL=[
{c:0,type:'sp',tau:.55,phi:-.3,arms:2,cc:2.4,bf:.2,pal:'blue',w:.5,d:0,sc:.36},
{c:1,type:'ell',tau:1.0,phi:-.5,pal:'ice',w:.3,d:.5,sc:.4,n:1.2},
{c:2,type:'irr',pal:'irr',w:.12,d:1,sc:.3,cl:[[-.3,-.1,.28],[.2,.1,.22],[.5,.55,.15],[-.1,.7,.12]],du:60},
{c:3,type:'pec',tau:.6,phi:-.3,arms:2,cc:2.2,bf:.25,pal:'warm',w:.5,d:1.5,sc:.2},
{c:4,type:'len',tau:1.3,phi:.5,arms:0,bf:.35,zt:.025,pal:'ice2',w:.4,d:.8,sc:.36,du:140},
{c:5,type:'dw',tau:.6,phi:-.4,pal:'dwarf',w:.1,d:2,sc:.4,n:1.7,tw:1},
{c:6,type:'act',tau:0,phi:0,pal:'act',w:.2,d:1.2,sc:.3},
{c:7,type:'sey',tau:.75,phi:.4,arms:2,cc:2.6,bf:.2,pal:'sey',w:.5,d:.3,sc:.36},
{c:8,type:'qso',tau:1.15,phi:-.45,arms:2,cc:2.2,bf:.35,pal:'qso',w:.45,d:.6,sc:.36},
{c:9,type:'blz',tau:1.1,phi:-.45,arms:2,cc:2.2,bf:.3,pal:'blz',w:.45,d:1.8,sc:.3},
{c:10,type:'sp',tau:.45,phi:.3,arms:2,cc:2.6,bf:.2,pal:'sey',w:.5,d:.4,sc:.2,orb:{a:.28,b:.22,ph:.6,sp:.1}},
{c:10,type:'sp',tau:1.2,phi:.4,arms:2,cc:2,bf:.3,pal:'warm',w:-.45,d:1,sc:.2,orb:{a:.28,b:.22,ph:.6+Math.PI,sp:.1}},
{c:11,type:'irr',pal:'dk',w:.04,d:2.2,sc:.3,dim:.22,n:.45,cl:[[-.3,-.1,.14],[.12,.08,.12],[.45,.32,.1],[-.1,.55,.1]],du:40}];
const NP=innerWidth<700?340:520;
GAL.forEach(G=>{
 G.pal=PAL[G.pal];G.spr=G.pal.map(spr);G.ps=[];G.du2=[];const pl=G.pal.length,n=Math.round(NP*(G.n||1)),T=G.tau||0;
 G.cp=Math.cos(G.phi||0);G.sn=Math.sin(G.phi||0);G.ct=Math.cos(T);G.st=Math.sin(T);
 for(let i=0;i<n;i++){
  let r1,tb=rnd()*TAU,g=gauss(),z1,ci;const u=rnd();
  if(G.type==='irr'){const c=G.cl[Math.floor(rnd()*G.cl.length)],x=c[0]+gauss()*c[2],y=c[1]+gauss()*c[2];r1=Math.hypot(x,y);tb=Math.atan2(y,x);g=0;z1=gauss()*.05;ci=Math.floor(rnd()*pl)}
  else if(G.type==='ell'||G.type==='dw'){r1=Math.abs(gauss())*(G.type==='dw'?.55:.4);if(r1>1.1)r1=rnd();g=0;z1=gauss()*.3;ci=rnd()<.55?1:Math.floor(rnd()*pl)}
  else if(G.type==='act'){r1=.55+rnd()*.45;g=0;z1=gauss()*.45;ci=rnd()<.6?0:Math.floor(rnd()*pl)}
  else{
   if(u<G.bf){r1=Math.abs(gauss())*.16;g=0;z1=gauss()*.08;ci=1}
   else{r1=Math.min(1.05,-Math.log(1-rnd()*.97)*.3);z1=gauss()*(G.zt||.03);
    if(G.arms){tb=Math.floor(rnd()*G.arms)*TAU/G.arms+G.cc*Math.log(1+r1/.12);if(rnd()<.16){tb=rnd()*TAU;g=0}}else g=0;
    ci=r1<.3?(rnd()<.6?1:2%pl):(rnd()<.65?0:3%pl)}
   if(G.type==='pec'){const v=rnd();if(v<.22){const s=rnd();r1=1+1.1*s;tb=.2+1.7*s;g=.1;z1=gauss()*.03;ci=rnd()<.5?0:1}else if(v<.29){r1=1.9+gauss()*.1;tb=-.45+gauss()*.07;g=0;ci=1;z1=gauss()*.05}}
  }
  const gx=gauss()*1.3,gy=gauss()*1.3;
  G.ps.push({r0:Math.hypot(gx,gy),th0:Math.atan2(gy,gx),z0:gauss()*1.1,r1,tb,g,z1,ci,b:.45+rnd()*.55,s:rnd()});
 }
 for(let i=0;i<(G.du||0);i++)G.du2.push({r:G.type==='irr'?rnd()*.8:.15+rnd()*.75,tb:rnd()*TAU,s:.07+rnd()*.08});
});
const BG=[];for(let i=0;i<40;i++)BG.push({x:rnd(),y:rnd(),r:rnd()*1.1+.3,p:rnd()*6.28});

function layout(){
 let best=null;[2,3,4,6].forEach(c=>{const r=Math.ceil(12/c),cw=(W-GAP*(c+1))/c,ch=(H-GAP*(r+1))/r,sc=Math.abs(Math.log(cw/ch));if(!best||sc<best.sc)best={c,r,cw,ch,sc}});
 CELLS=Array.from({length:12},(_,i)=>({x:GAP+(i%best.c)*(best.cw+GAP),y:GAP+Math.floor(i/best.c)*(best.ch+GAP),w:best.cw,h:best.ch,g:[]}));
 GAL.forEach(G=>CELLS[G.c].g.push(G));
}
function resize(){DPR=Math.min(devicePixelRatio||1,1.5);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);layout()}
addEventListener('resize',resize);new ResizeObserver(resize).observe(cv);resize();

function drawG(G,cl,t){
 const m=Math.min(cl.w,cl.h),Rk=m*G.sc;let cx=cl.x+cl.w/2,cy=cl.y+cl.h*.46;
 if(G.orb){const a=G.orb.ph+G.orb.sp*t;cx+=Math.cos(a)*G.orb.a*m;cy+=Math.sin(a)*G.orb.b*m}
 const e=sm((t-3-G.d)/8),m2=sm((t-8-G.d)/8),ig=sm((t-7-G.d)/6),scat=(.28+(1-m2)*1.1),sk=Math.max(1.8,Rk/16)*(G.type==='dw'?.75:1),dim=G.dim||1;
 for(let i=0;i<G.ps.length;i++){
  const p=G.ps[i],r=p.r0+(p.r1-p.r0)*e,a=p.tb+p.g*scat+(p.th0-p.tb)*(1-e)+G.w*(1-.07*r)*t,z=p.z0+(p.z1-p.z0)*e;
  const x=r*Math.cos(a),y=r*Math.sin(a),Y=y*G.ct-z*G.st,sz=sk*(1+(1-ig)*1.6)*(.8+p.s*.8);
  ctx.globalAlpha=(.18+.82*ig)*p.b*dim*(G.tw?.6+.4*Math.sin(t*2+p.s*40):1);
  ctx.drawImage(G.spr[p.ci],cx+(x*G.cp-Y*G.sn)*Rk-sz/2,cy+(x*G.sn+Y*G.cp)*Rk-sz/2,sz,sz);
 }
 const gl=(k,s,a)=>{ctx.globalAlpha=a;ctx.drawImage(G.spr[k],cx-s/2,cy-s/2,s,s)};
 if(G.type!=='dw')gl(0,Rk*(G.type==='dk'?3.4:2.8),(G.type==='dk'?.3:.16)*ig*e);
 gl(G.type==='act'?3:1,Rk*(G.type==='qso'?1.6:G.type==='act'?.55:.8),Math.min(1,.9*e*ig)*dim);
 if(G.du2.length){ctx.globalCompositeOperation='source-over';const da=.35*ig*e;G.du2.forEach(d=>{const a=d.tb+G.w*t,x=d.r*Math.cos(a),y=d.r*Math.sin(a)*G.ct,s=Rk*d.s*2;ctx.globalAlpha=da;ctx.drawImage(DKS,cx+(x*G.cp-y*G.sn)*Rk-s/2,cy+(x*G.sn+y*G.cp)*Rk-s/2,s,s)});ctx.globalCompositeOperation='lighter'}
 if(G.type==='act'){const a0=sm((t-10-G.d)/3);ctx.lineWidth=1.4;for(let k=0;k<4;k++){const an=Math.PI/4+k*Math.PI/2,ex=cx+Math.cos(an)*Rk*1.3,ey=cy+Math.sin(an)*Rk*1.3,g=ctx.createLinearGradient(cx,cy,ex,ey);g.addColorStop(0,`rgba(255,235,220,${.9*a0})`);g.addColorStop(1,'rgba(255,200,170,0)');ctx.globalAlpha=1;ctx.strokeStyle=g;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ex,ey);ctx.stroke()}}
 if(G.type==='qso'||G.type==='blz'){
  const q=G.type==='qso',ja=q?-2.3:-1.1,L=Rk*(q?1.9:2.4),hw=Rk*(q?.4:.06),jt=sm((t-12-G.d)/3),c=q?'170,200,255':'40,200,210';
  const jet=(ang,len,w,al)=>{const ex=cx+Math.cos(ang)*len,ey=cy+Math.sin(ang)*len,nx=-Math.sin(ang)*w,ny=Math.cos(ang)*w,g=ctx.createLinearGradient(cx,cy,ex,ey);g.addColorStop(0,`rgba(${c},${.8*al})`);g.addColorStop(1,`rgba(${c},0)`);ctx.globalAlpha=1;ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ex+nx,ey+ny);ctx.lineTo(ex-nx,ey-ny);ctx.closePath();ctx.fill()};
  jet(ja,L,hw,jt);if(!q)jet(ja+Math.PI,L*.6,hw*.8,jt*.7);
  gl(0,Rk*.5,.8*jt);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=jt;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx,cy,Rk*.05,0,TAU);ctx.fill();ctx.globalCompositeOperation='lighter'}
 if(G.type==='dk'||G.dim){ctx.setLineDash([4,5]);ctx.lineWidth=1;ctx.strokeStyle=`rgba(190,130,255,${.3*ig})`;ctx.globalAlpha=1;ctx.beginPath();ctx.arc(cx,cy,Rk*1.5,0,TAU);ctx.stroke();ctx.setLineDash([])}
}

function frame(now){
 const dt=Math.min(.05,Math.max(0,(now-lastFrame)/1000));lastFrame=now;elapsed+=dt*speed;const t=elapsed;
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 CELLS.forEach((cl,i)=>{
  ctx.save();ctx.beginPath();ctx.rect(cl.x,cl.y,cl.w,cl.h);ctx.clip();
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle='#05060b';ctx.fillRect(cl.x,cl.y,cl.w,cl.h);
  BG.forEach(s=>{ctx.globalAlpha=.2+.4*Math.sin(t*1.3+s.p)**2;ctx.fillStyle='#fff';ctx.fillRect(cl.x+s.x*cl.w,cl.y+s.y*cl.h,s.r,s.r)});
  ctx.globalCompositeOperation='lighter';cl.g.forEach(G=>drawG(G,cl,t));
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  let fs=Math.min(26,cl.w*.085);const set=()=>{ctx.font=`600 ${fs}px Teko,"Arial Narrow",Impact,sans-serif`};set();while(ctx.measureText(NAMES[i]).width>cl.w-10&&fs>8){fs-=1;set()}
  ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=6;ctx.fillStyle='#fff';ctx.fillText(NAMES[i],cl.x+cl.w/2,cl.y+cl.h-8);ctx.shadowBlur=0;
  ctx.restore();
 });
 ph.textContent=t<3?'Morphology: spiral, elliptical and irregular':t<8?'Shapes and sizes: lenticular, peculiar and dwarf':t<14?'Some galaxies host an active nucleus':t<20?'Quasars and blazars: bright active nuclei':'Interactions and faint-galaxy candidates';
 ag.textContent='Conceptual comparison · not a formation timeline or photograph';
 requestAnimationFrame(frame);
}
document.getElementById('replay').addEventListener('click',()=>{elapsed=0;lastFrame=performance.now()});
document.getElementById('skip').addEventListener('click',()=>{elapsed=24;lastFrame=performance.now()});
requestAnimationFrame(frame);
addEventListener('message',e=>{const d=e.data;if(e.source===parent&&d&&d.type==='eyewitness-speed'&&Number.isFinite(d.speed))speed=Math.max(.25,Math.min(2,d.speed))});
</script>
</body>
</html>
