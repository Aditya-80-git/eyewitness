<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Dark Ages: when the first stars switched on</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#010209;--ink:#fff;--btn:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:Caveat,"Segoe Print","Bradley Hand","Comic Sans MS",cursive}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none}
#btns{display:flex;gap:6px;pointer-events:auto}
#btns button{padding:6px 12px;border:1px solid rgba(255,255,255,.4);border-radius:20px;background:var(--btn);color:var(--ink);font:600 13px system-ui,sans-serif;cursor:pointer}
#btns button:focus-visible{outline:2px solid #8fb8ff;outline-offset:2px}
#hud{color:var(--ink);font-weight:700;font-size:24px;line-height:1.1;text-shadow:0 0 6px #000,0 0 3px #000;max-width:92vw}
#hud small{display:block;font-size:18px;opacity:.85}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);text-align:center;color:var(--ink);font-weight:700;font-size:18px;opacity:.65;text-shadow:0 0 6px #000;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" aria-label="Animation of the cosmic Dark Ages, when the first stars lit up the universe"></canvas>
<div id="top"><div id="btns"><button id="replay" type="button">Replay</button><button id="skip" type="button">Skip to the end</button></div><div id="hud"><span id="ph"></span><small id="ag"></small></div></div>
<div id="hint">Move your mouse or drag to look around</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ph=document.getElementById('ph'),ag=document.getElementById('ag');
let W,H,DPR,unit,t0=performance.now(),speed=1,ptr=false,mx=0,my=0,smx=0,smy=0;
const TAU=Math.PI*2,sm=x=>{x=x<0?0:x>1?1:x;return x*x*(3-2*x)};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=rng(17);
function gauss(){let u=0;while(!u)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*rnd())}
function resize(){DPR=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;unit=Math.max(1,Math.min(W,H)/520);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',resize);resize();
cv.addEventListener('pointermove',e=>{ptr=true;mx=e.clientX/W-.5;my=e.clientY/H-.5;document.getElementById('hint').style.opacity=0});

function spr(c,core,dark){const s=document.createElement('canvas');s.width=s.height=32;const g=s.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);
 r.addColorStop(0,core?'rgba(255,255,255,1)':`rgba(${c[0]},${c[1]},${c[2]},${dark?1:.9})`);r.addColorStop(.3,`rgba(${c[0]},${c[1]},${c[2]},${dark?.6:.8})`);r.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);g.fillStyle=r;g.fillRect(0,0,32,32);return s}
const SP={ind:spr([25,50,150]),blu:spr([70,120,255]),pur:spr([110,70,200]),org:spr([255,125,55]),red:spr([255,70,40]),dk:spr([0,0,8],0,1)};
const SC={blu:spr([90,150,255],1),cy:spr([170,215,255],1),warm:spr([255,185,110],1),wht:spr([255,255,255],1)};
const mob=innerWidth<700,M=()=>Math.min(W,H);
const dr=(sp,x,y,r,a)=>{ctx.globalAlpha=a;ctx.drawImage(sp,x-r,y-r,r*2,r*2)};

// stars: x,y,type,size,ignition time, dies-in-supernova
const ND=[[.22,.47,'b',1,16.2,0],[.13,.76,'b',.7,17.4,0],[.78,.45,'b',.5,18.2,0],[.38,.34,'b',.45,19,0],[.47,.6,'b',.5,19.6,0],[.3,.85,'b',.45,20.3,0],[.7,.9,'b',.4,21,0],[.55,.62,'b',.8,16.8,1],[.55,.2,'b',.7,17.6,1],[.08,.3,'b',.6,18.6,1],[.63,.7,'o',1,25.2,0],[.5,.14,'o',.8,26,0],[.14,.22,'o',.5,27,0],[.9,.25,'o',.45,26.5,0]]
 .map(a=>({x:a[0],y:a[1],ty:a[2],sz:a[3],ig:a[4],sn:a[5],ex:a[5]?a[4]+3.6+rnd()*1.6:0,ph:rnd()*6.28,rot:(rnd()-.5)*.3,deb:Array.from({length:36},()=>({a:rnd()*TAU,v:30+rnd()*90}))}));
// dark filaments that join the stars (the cosmic web)
const ED=[];ND.forEach((n,i)=>{ND.map((m,j)=>[Math.hypot(n.x-m.x,n.y-m.y),j]).sort((a,b)=>a[0]-b[0]).slice(1,3).forEach(([d,j])=>ED.push([i,j]))});
const B=[];for(let i=0;i<(mob?150:230);i++){
 let x,y;if(rnd()<.7){const [a,b]=ED[Math.floor(rnd()*ED.length)],u=rnd();x=ND[a].x+(ND[b].x-ND[a].x)*u+gauss()*.03;y=ND[a].y+(ND[b].y-ND[a].y)*u+gauss()*.03}else{const n=ND[Math.floor(rnd()*ND.length)];x=n.x+gauss()*.08;y=n.y+gauss()*.08}
 B.push({x1:x,y1:y,x0:x+gauss()*.3,y0:y+gauss()*.3,s:.1+.14*rnd(),c:rnd()<.25?'pur':'ind',ph:rnd()*6.28})}
const DK=[];for(let i=0;i<40;i++)DK.push({x:rnd(),y:rnd(),s:.1+.2*rnd(),ph:rnd()*6.28});
const FOG=[];for(let i=0;i<24;i++)FOG.push({x:rnd(),y:rnd(),s:.25+.3*rnd()});
const MO=[];for(let i=0;i<(mob?350:550);i++){const n=Math.floor(rnd()*ND.length);MO.push({x0:rnd(),y0:rnd(),n,dx:gauss()*.03,dy:gauss()*.03})}
const TS=[];for(let i=0;i<(mob?170:260);i++){const n=Math.floor(rnd()*ND.length),nd=ND[n],o=nd.ty==='o';TS.push({n,ox:gauss()*.07,oy:gauss()*.07,born:o?25+rnd()*7:18+rnd()*13,w:o?rnd()<.8:rnd()<.12,s:.8+rnd()*1.2,ph:rnd()*6.28})}

function spike(x,y,L,rot,a,col){for(let k=0;k<4;k++){const an=rot+k*Math.PI/2,ex=x+Math.cos(an)*L*(k%2?.7:1),ey=y+Math.sin(an)*L*(k%2?.7:1);const g=ctx.createLinearGradient(x,y,ex,ey);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);ctx.strokeStyle=g;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke()}}

function frame(now){
 const t=(now-t0)/1000*speed;
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#030820');bg.addColorStop(1,'#010209');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 const f=1-sm(t/5.5);if(f>.01){ctx.globalAlpha=.4*f;ctx.fillStyle='#7a2a0f';ctx.fillRect(0,0,W,H)}
 const tx=ptr?mx:.35*Math.sin(t*.08),ty=ptr?my:.25*Math.cos(t*.06);smx+=(tx-smx)*.05;smy+=(ty-smy)*.05;
 const oN=[-smx*40*unit,-smy*28*unit],oS=[-smx*18*unit,-smy*12*unit],m=M(),e=sm((t-3)/9);
 ctx.globalCompositeOperation='lighter';
 if(f>.01)FOG.forEach(b=>dr(SP.org,b.x*W,b.y*H,b.s*Math.max(W,H),.1*f));
 // where each star has switched on, and how far its light reaches
 const ST=ND.map(n=>{const q=t-n.ig,alive=!n.sn||t<n.ex;return{q,alive,R:q>0?300*n.sz*unit*sm(q/8):0,int:q>0?(alive?1:1-.6*sm((t-n.ex)/5)):0,x:n.x*W+oS[0],y:n.y*H+oS[1],xn:n.x*W+oN[0],yn:n.y*H+oN[1]}});
 // gas clouds that glow blue when starlight reaches them
 const nb=sm((t-2.5)/3);
 B.forEach(b=>{const x=(b.x0+(b.x1-b.x0)*e)*W+oN[0],y=(b.y0+(b.y1-b.y0)*e)*H+oN[1],r=b.s*m*1.2;let lit=0;
  ST.forEach(s=>{if(s.R>1){const v=1-Math.hypot(x-s.xn,y-s.yn)/(s.R*1.6);if(v>0)lit+=v*v*s.int}});
  dr(SP[b.c],x,y,r,.1*nb*(.8+.2*Math.sin(t*.5+b.ph)));if(lit>.02)dr(SP.blu,x,y,r*.95,.32*Math.min(1,lit))});
 ctx.globalCompositeOperation='source-over';
 DK.forEach(d=>dr(SP.dk,d.x*W+oN[0]*.7,d.y*H+oN[1]*.7,d.s*m*1.2,.32*sm((t-4)/3)));
 ctx.globalCompositeOperation='lighter';
 // gas falling into the clumps
 const e2=sm((t-5)/10);
 MO.forEach(p=>{const n=ND[p.n],a=.5*sm((t-4)/2)*(1-sm((t-n.ig)/4));if(a<.01)return;const x=(p.x0+(n.x+p.dx-p.x0)*e2)*W+oN[0],y=(p.y0+(n.y+p.dy-p.y0)*e2)*H+oN[1];dr(SP.blu,x,y,1.6*unit,a)});
 // glow bubbles around the new stars and leftovers of exploded ones
 ST.forEach((s,i)=>{const n=ND[i];if(s.R>1)dr(SP.blu,s.xn,s.yn,s.R,.16*s.int);
  if(n.sn&&t>n.ex){const a=sm((t-n.ex)/3);dr(SP.org,s.xn,s.yn,90*n.sz*unit,.14*a*(1+.2*Math.sin(t*1.3+n.ph)));dr(SP.pur,s.xn,s.yn,150*n.sz*unit,.08*a)}
  if(t<n.ig){const p=sm((t-(n.ig-7))/7);if(p>.01){dr(SP.red,s.x,s.y,28*n.sz*unit*(.4+.6*p),.55*p);dr(SC.wht,s.x,s.y,6*n.sz*unit,.5*p*p)}}});
 // small stars and clusters being born
 TS.forEach(s=>{const q=t-s.born;if(q<0)return;const n=ND[s.n],sc=sm(q/1.2),fl=Math.exp(-q*1.5),x=n.x*W+oS[0]+s.ox*m,y=n.y*H+oS[1]+s.oy*m,tw=.55+.45*Math.pow(Math.sin(t*2+s.ph),2);
  dr(s.w?SC.warm:SC.blu,x,y,s.s*unit*2.4*sc,tw);if(fl>.05)dr(SC.wht,x,y,12*unit*fl,.7*fl)});
 // the big stars with their light spikes
 ctx.lineWidth=1.2*unit;ctx.lineCap='round';
 ND.forEach((n,i)=>{const s=ST[i];if(s.q<=0||!s.alive)return;const o=n.ty==='o';let sc=sm(s.q/1.2);if(n.sn)sc*=1+.5*sm((t-(n.ex-2))/2);
  const tw=.88+.12*Math.sin(t*3+n.ph),L=(o?55:70)*n.sz*unit*sc*tw;
  dr(o?SP.org:SP.blu,s.x,s.y,70*n.sz*unit*sc,.6);dr(o?SC.warm:SC.cy,s.x,s.y,22*n.sz*unit*sc,.9);dr(SC.wht,s.x,s.y,8*n.sz*unit*sc,1);
  spike(s.x,s.y,L,n.rot,.9,o?'255,200,140':'170,215,255');if(!o)spike(s.x,s.y,L*.6,n.rot+Math.PI/4,.7,'200,230,255');
  const fl=Math.exp(-s.q*1.4);if(fl>.02)dr(SC.wht,s.x,s.y,240*n.sz*unit*fl,.8*fl);
  if(s.q<2.5){ctx.globalAlpha=.5*(1-s.q/2.5);ctx.strokeStyle='rgba(140,200,255,1)';ctx.beginPath();ctx.arc(s.x,s.y,(20+120*s.q)*n.sz*unit,0,TAU);ctx.stroke()}});
 // supernova explosions
 ND.forEach((n,i)=>{if(!n.sn)return;const q=t-n.ex,s=ST[i];if(q<0||q>5)return;
  dr(SC.wht,s.x,s.y,520*unit*n.sz*Math.exp(-q*1.2),Math.min(1,.9*Math.exp(-q*.8)));
  ctx.globalAlpha=.6*(1-q/5);ctx.strokeStyle='rgba(255,190,130,1)';ctx.lineWidth=2.5*unit;ctx.beginPath();ctx.arc(s.x,s.y,(40+q*90)*unit*n.sz,0,TAU);ctx.stroke();
  n.deb.forEach(d=>dr(SC.warm,s.x+Math.cos(d.a)*q*d.v*unit*n.sz,s.y+Math.sin(d.a)*q*d.v*unit*n.sz,2.2*unit,Math.max(0,1-q/4)))});
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 ph.textContent=t<4?'1. The glowing fog of the early universe cools and fades':t<10?'2. The Dark Ages: only cold gas and invisible dark matter':t<16?'3. Gravity pulls the gas into dense clumps along dark filaments':t<20?'4. Cosmic dawn: the first stars ignite and light up the gas':t<28?'5. The biggest stars die in supernovae and seed new stars':'The Dark Ages have ended: the first stars and clusters light up the nebula';
 let a;if(t<4)a=null;else if(t<16)a=.38+sm((t-4)/12)*100;else a=100+Math.min(t-16,16)*.75;
 ag.textContent=a===null?'380,000 years after the Big Bang':Math.round(a)+' million years after the Big Bang (time sped up)';
 requestAnimationFrame(frame);
}
document.getElementById('replay').addEventListener('click',()=>{t0=performance.now()});
document.getElementById('skip').addEventListener('click',()=>{t0=performance.now()-34000/speed});
requestAnimationFrame(frame);
addEventListener('message',e=>{const d=e.data;if(e.source===parent&&d&&d.type==='eyewitness-speed'&&Number.isFinite(d.speed))speed=Math.max(.25,Math.min(2,d.speed))});
</script>
</body>
</html>
